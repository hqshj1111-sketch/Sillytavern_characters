<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案25：地下城地图HUD风 | Dungeon Map Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050810;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 10px;
    font-family: 'Noto Sans SC', 'Share Tech Mono', monospace;
    color: #8098b0; font-size: 11px;
  }

  .map-hud {
    width: 100%; max-width: 660px;
    position: relative;
    background: #080c14;
    border: 3px solid #2a3a4a;
    overflow: hidden;
  }

  /* ====== 地图基底 ====== */
  .map-layer {
    height: 480px;
    position: relative; overflow: hidden;
    background:
      /* 石板地砖网格 */
      linear-gradient(90deg, rgba(30,40,50,0.15) 1px, transparent 1px),
      linear-gradient(0deg, rgba(30,40,50,0.15) 1px, transparent 1px),
      /* 瓦片底色 */
      linear-gradient(180deg, #060a10, #0a0e16);
    background-size: 32px 32px, 32px 32px, 100% 100%;
  }
  /* 墙壁 */
  .map-layer::before {
    content: '';
    position: absolute; inset: 0;
    background:
      /* 水平走廊 */
      linear-gradient(0deg, rgba(20,30,40,0.6) 20%, transparent 20%, transparent 80%, rgba(20,30,40,0.6) 80%),
      /* 垂直走廊 */
      linear-gradient(90deg, rgba(20,30,40,0.4) 30%, transparent 30%, transparent 70%, rgba(20,30,40,0.4) 70%),
      /* 房间 */
      linear-gradient(0deg,
        transparent 0%, transparent 8%, rgba(20,30,40,0.3) 8%,
        rgba(20,30,40,0.3) 14%, transparent 14%, transparent 42%,
        rgba(20,30,40,0.3) 42%, rgba(20,30,40,0.3) 48%, transparent 48%,
        transparent 60%, transparent 65%, rgba(20,30,40,0.3) 65%,
        rgba(20,30,40,0.3) 70%, transparent 70%, transparent 100%);
    pointer-events: none;
  }
  /* 玩家标记 */
  .player-marker {
    position: absolute; top: 45%; left: 48%;
    width: 16px; height: 16px;
    background: #40e080;
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    filter: drop-shadow(0 0 6px rgba(64,224,128,0.6));
    z-index: 10;
    animation: marker-pulse 1.5s ease infinite;
  }
  @keyframes marker-pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  /* 敌人标记 */
  .enemy-marker {
    position: absolute; top: 30%; left: 55%;
    width: 10px; height: 10px; border-radius: 50%;
    background: #e04040;
    filter: drop-shadow(0 0 4px rgba(224,64,64,0.5));
    z-index: 9;
    animation: enemy-pulse 0.8s ease infinite alternate;
  }
  @keyframes enemy-pulse {
    from { transform: scale(0.8); opacity: 0.6; }
    to { transform: scale(1.3); opacity: 1; }
  }
  .enemy-marker:nth-child(3) { top: 60%; left: 42%; animation-delay: 0.3s; }
  .enemy-marker:nth-child(4) { top: 40%; left: 62%; animation-delay: 0.6s; }
  /* 宝箱标记 */
  .chest-marker {
    position: absolute; top: 75%; left: 35%;
    width: 12px; height: 12px;
    background: #e0c040;
    clip-path: polygon(20% 40%, 80% 40%, 80% 100%, 20% 100%);
    filter: drop-shadow(0 0 4px rgba(224,192,64,0.4));
    z-index: 9;
  }
  /* 网格标签 */
  .grid-label {
    position: absolute; font-family: 'Share Tech Mono', monospace;
    font-size: 8px; color: rgba(80,110,140,0.4);
    letter-spacing: 1px;
  }
  .grid-label.tl { top: 6px; left: 8px; }
  .grid-label.tr { top: 6px; right: 8px; }
  .grid-label.bl { bottom: 6px; left: 8px; }
  .grid-label.br { bottom: 6px; right: 8px; }

  /* ====== 浮层面板 ====== */
  .hud-overlay {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 20;
  }
  .hud-overlay > * { pointer-events: auto; }

  /* 左上：HP/MP/SP状态 */
  .hud-top-left {
    position: absolute; top: 8px; left: 8px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .hud-stat-bar {
    display: flex; align-items: center; gap: 4px;
    background: rgba(5,8,16,0.85);
    border: 1px solid rgba(40,60,80,0.5);
    padding: 3px 6px;
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
  }
  .hud-stat-bar .icon { width: 14px; text-align: center; }
  .hud-stat-bar .bar-bg {
    width: 80px; height: 6px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(40,60,80,0.3);
  }
  .hud-stat-bar .bar-fill { height: 100%; }
  .hud-stat-bar .bar-fill.hp { background: #c04040; }
  .hud-stat-bar .bar-fill.mp { background: #4080c0; }
  .hud-stat-bar .bar-fill.sp { background: #c0a040; }
  .hud-stat-bar .num { width: 36px; text-align: right; color: #90b0c0; }

  /* 右上：小地图图例 */
  .hud-top-right {
    position: absolute; top: 8px; right: 8px;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(5,8,16,0.85);
    border: 1px solid rgba(40,60,80,0.5);
    padding: 6px 8px;
    font-family: 'Share Tech Mono', monospace; font-size: 7px;
  }
  .hud-top-right .legend-item {
    display: flex; align-items: center; gap: 4px; color: #406080;
  }
  .hud-top-right .legend-dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .hud-top-right .legend-dot.player { background: #40e080; }
  .hud-top-right .legend-dot.enemy { background: #e04040; }
  .hud-top-right .legend-dot.chest { background: #e0c040; }

  /* 底部：叙事窗 */
  .hud-narrative {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    background: rgba(5,8,16,0.9);
    border: 1px solid rgba(40,60,80,0.5);
    padding: 10px 14px;
    font-size: 11px; line-height: 1.7; color: #708090;
    max-height: 130px; overflow-y: auto;
  }
  .hud-narrative p { margin-bottom: 6px; }
  .hud-narrative p:last-child { margin-bottom: 0; }
  .hud-narrative .glow { color: #60b0d0; }
  .hud-narrative .alert { color: #d06060; }

  /* 右下：属性速查 */
  .hud-attrs-mini {
    position: absolute; right: 8px; bottom: 148px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
    background: rgba(5,8,16,0.85);
    border: 1px solid rgba(40,60,80,0.5);
    padding: 6px 8px;
  }
  .hud-attrs-mini span {
    font-family: 'Share Tech Mono', monospace; font-size: 8px;
    color: #5080a0; letter-spacing: 1px;
  }
  .hud-attrs-mini span .v { color: #80b0c0; margin-left: 3px; }

  /* 底部行动条 */
  .hud-actions {
    position: absolute; bottom: -48px; left: 0; right: 0;
    display: flex; gap: 3px; padding: 4px 8px;
    background: rgba(5,8,16,0.9);
    border: 1px solid rgba(40,60,80,0.5);
    border-top: none;
  }
  .hud-action-btn {
    flex: 1; font-family: 'Noto Sans SC', sans-serif; font-size: 10px;
    background: rgba(10,16,30,0.6); color: #507080;
    border: 1px solid rgba(40,60,80,0.4); padding: 6px 4px;
    cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .hud-action-btn:hover { color: #80c0d0; border-color: #5090b0; }
  .hud-action-btn.primary { color: #80d0e0; border-color: #4090b0; }

  /* 底部信息 */
  .hud-footer {
    position: absolute; bottom: -72px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(5,8,16,0.9);
    border: 1px solid rgba(40,60,80,0.5);
    border-top: none;
    font-family: 'Share Tech Mono', monospace; font-size: 8px;
    color: #305060; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="map-hud">

  <!-- ====== 地图层 ====== -->
  <div class="map-layer">
    <div class="grid-label tl">B3F</div>
    <div class="grid-label tr">N</div>
    <div class="grid-label bl">ASTOR</div>
    <div class="grid-label br">384.10.15</div>
    <div class="player-marker"></div>
    <div class="enemy-marker"></div>
    <div class="enemy-marker"></div>
    <div class="enemy-marker"></div>
    <div class="chest-marker"></div>
  </div>

  <!-- ====== HUD覆盖层 ====== -->
  <div class="hud-overlay">

    <!-- 左上状态条 -->
    <div class="hud-top-left">
      <div class="hud-stat-bar">
        <span class="icon">♥</span>
        <div class="bar-bg"><div class="bar-fill hp" style="width:78%"></div></div>
        <span class="num">78/100</span>
      </div>
      <div class="hud-stat-bar">
        <span class="icon">✦</span>
        <div class="bar-bg"><div class="bar-fill mp" style="width:54%"></div></div>
        <span class="num">54/100</span>
      </div>
      <div class="hud-stat-bar">
        <span class="icon">⚡</span>
        <div class="bar-bg"><div class="bar-fill sp" style="width:90%"></div></div>
        <span class="num">90/100</span>
      </div>
    </div>

    <!-- 右上图例 -->
    <div class="hud-top-right">
      <div class="legend-item"><span class="legend-dot player"></span> PLAYER</div>
      <div class="legend-item"><span class="legend-dot enemy"></span> HOSTILE ×3</div>
      <div class="legend-item"><span class="legend-dot chest"></span> LOOT</div>
      <div style="margin-top:2px; color:#305060;">EXP 35%</div>
    </div>

    <!-- 右下属性 -->
    <div class="hud-attrs-mini">
      <span>ATK<span class="v">42</span></span>
      <span>DEF<span class="v">28</span></span>
      <span>AGI<span class="v">35</span></span>
      <span>INT<span class="v">30</span></span>
      <span>LCK<span class="v">18</span></span>
      <span>G<span class="v">1250</span></span>
    </div>

    <!-- 底部叙事 -->
    <div class="hud-narrative">
      <p>你推开沉重的石门，腐朽的空气中弥漫着<span class="glow">魔素</span>的微光。甬道深处传来低沉的嘶吼——<span class="alert">三只哥布林</span>从阴影中窜出，手持锈迹斑斑的短刀向你扑来。你握紧手中的<span class="glow">长剑</span>，脚下魔力纹路微微亮起。左侧那只头领模样家伙的眼中闪烁着<span class="alert">不寻常的红光</span>……</p>
      <p>甬道两侧石壁上，古老的浮雕描绘着曾被封印在此的<span class="glow">魅魔女王</span>。</p>
    </div>
  </div>

  <!-- ====== 底部操作条 ====== -->
  <div class="hud-actions">
    <button class="hud-action-btn primary">⚔ 斩向头领</button>
    <button class="hud-action-btn">🔥 火球灼烧</button>
    <button class="hud-action-btn">🛡 防御观察</button>
    <button class="hud-action-btn">💋 魅惑</button>
  </div>

  <div class="hud-footer">
    <span>WPN 长剑Lv3</span>
    <span>ARM 皮甲Lv2</span>
    <span>ITM 药水×3</span>
    <span>TURN 12</span>
  </div>

</div>
</body>
</html>
