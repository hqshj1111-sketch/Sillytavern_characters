地理信息:
  龙脊联邦:
    简述: "龙脊联邦是位于阿斯特大陆中央山脉的龙兽人国度，由七个龙兽人氏族以长老议会制共治，人口约八十万。主体种族为龙兽人（60%），辅以蜥蜴兽人、人类、精灵及少量恶魔等。自然环境为高山火山地带，空气稀薄气温偏低。冒险者公会名为龙息公会，建筑倚山凿石而成，以黑曜石与熔岩石砌筑，入口设永久火盆为标识。"
    自然环境: "龙脊山脉纵贯全境，地形以海拔三千米以上的高山为主，分布有活火山群、硫磺温泉区、冰川峡谷和深不见底的地渊裂隙。空气稀薄，气温常年偏低，山顶终年积雪。火山活动频繁区域形成局部温暖谷地，是主要聚居区。"
    社会结构: "部落长老议会制。全国由七个主要龙兽人氏族组成，每个氏族推举一名长老进入「龙息议会」共同执政，每十年从中推选一名「龙主」担任对外代表。氏族内部以血统和个体战斗力双重标准划分阶层，强调实力尊卑。人口总量约八十万，属于全大陆人口最稀少的国家。"
    种族构成: "龙兽人 60%、蜥蜴兽人 10%、蛇兽人 8%、人类 8%、精灵 5%、恶魔与魅魔 5%、混血种族 4%"
    公会名称: "龙息公会"
    公会风格: "倚山凿石建造，外墙以黑曜石与熔岩石砌筑，内部空间高挑宽阔以容纳龙兽人体型，入口处设有永久燃烧的火盆作为标识。"
    城市列表:
      烬喉:
        城市规模: "大型城市，人口约二十五万，龙脊联邦首都及最大城市"
        种族构成: "龙兽人 70%、蜥蜴兽人 10%、蛇兽人 5%、精灵 5%、恶魔与魅魔 5%、人类 3%、混血种族 2%"
        自然环境: "建于死火山的巨型火山口内，火山口直径约八公里，四周为环形山壁形成天然屏障。城内多层级台地，利用火山地热提供全城供暖，中心为岩浆湖改造的仪式广场。"
        整体氛围:
          春: "山壁冰雪融化，城内雾气浓重，可见度低，空气湿润带有硫磺味"
          夏: "雾气消散，火山口内气温凉爽宜人，各氏族代表往返频繁，政治活动活跃"
          秋: "山风从山口灌入，城内多狂风，旗帜猎猎作响，空气中矿物味加重"
          冬: "山壁封冻，城内依赖地热维持温度，街道行人稀少，气氛肃穆沉寂"
        简述: "烬喉是龙脊联邦首都，建于死火山口内，人口约二十五万。种族以龙兽人为主（70%），多种族混居。利用火山地热供暖全城，地形为环形山壁内的多层级台地。主要地点包括龙息议会厅、熔炉大工坊、温泉广场、龙牙瞭望台和古龙墓园。"
        地点列表:
          龙息议会厅:
            是否城内: true
            方位: "中"
            简述: "龙脊联邦最高政治机构，七氏族长老议事场所。建筑为黑曜石环形大厅，中央设熔岩火盆，席位按氏族图腾排列。"
          熔炉大工坊:
            是否城内: true
            方位: "东"
            简述: "龙兽人工匠集中锻造的大型工坊区，利用岩浆热力冶炼金属，生产全大陆品质最高的龙兽人武器与盔甲。"
          温泉广场:
            是否城内: true
            方位: "南"
            简述: "利用地热温泉建造的公共浴场和社交广场，多种族居民在此休憩交流，蒸汽终年弥漫。"
          龙牙瞭望台:
            是否城内: false
            方位: "北"
            简述: "建于火山口北缘最高处的石质瞭望塔，可俯瞰全城及龙脊山脉北段，由龙息议会卫队驻守。"
          古龙墓园:
            是否城内: false
            方位: "西"
            简述: "龙兽人先祖的安葬之地，墓碑为天然火山岩柱，位于城外西侧一处火山灰覆盖的台地上，气氛庄重。"
      灼鳞:
        城市规模: "中型城市，人口约十二万，龙脊联邦矿业与锻造中心"
        种族构成: "龙兽人 55%、蜥蜴兽人 20%、矮人 10%、蛇兽人 5%、人类 5%、混血种族 5%"
        自然环境: "位于龙脊山脉活火山带南侧山腰，城市沿熔岩河两岸依山势而建。地表遍布黑色火山岩和硫磺结晶，空中常年飘浮火山灰，周围分布大量魔晶矿脉与黑曜石开采场。"
        整体氛围:
          春: "火山灰沉降量减少，气温回暖，矿工与工匠进入最活跃的生产期，城内敲击声昼夜不断"
          夏: "火山活动增强，地面温度升高，空气中硫磺浓度增加，居民佩戴湿布掩面的比例上升"
          秋: "矿区产量稳定，商队频繁往来运输矿石与成品，工坊烟囱排放量增大，天空呈灰橙色"
          冬: "火山活动减弱，部分露天矿场停工，工匠转向室内精细加工，城市节奏放慢"
        简述: "灼鳞是龙脊联邦的矿业与锻造中心，人口约十二万，位于活火山带南侧山腰。种族以龙兽人（55%）与蜥蜴兽人（20%）为主，矮人亦有一定比例。城市沿熔岩河依山而建，周围矿脉丰富。主要地点包括大铁砧锻冶厅、熔岩河矿道、黑曜石采掘场、硫磺谷和火晶洞窟。"
        地点列表:
          大铁砧锻冶厅:
            是否城内: true
            方位: "中"
            简述: "全联邦最大的公共锻造工坊，设有龙兽人体型的巨型铁砧与魔力锻炉，工匠可租用炉位进行武器和盔甲打造。"
          熔岩河矿道:
            是否城内: true
            方位: "南"
            简述: "沿熔岩河两岸修建的矿车运输通道，连接城内各工坊与城郊矿场入口，路面铺设耐热火山岩板。"
          黑曜石采掘场:
            是否城内: false
            方位: "西"
            简述: "大型露天黑曜石开采区，产出用于建筑与武器的高级黑曜岩，采掘面高达数十米，由蜥蜴兽人矿工主力开采。"
          硫磺谷:
            是否城内: false
            方位: "东"
            简述: "火山硫磺气体密集的山谷地带，地表覆盖黄色硫磺结晶，采集硫磺用于炼金与魔法材料制备，进入需防护装备。"
          火晶洞窟:
            是否城内: false
            方位: "北"
            简述: "天然地下洞穴系统，洞壁生长高温形成的魔法火晶，是顶级魔法触媒产地，内部温度高且有熔岩池，仅高阶冒险者能深入。"
      霜脊:
        城市规模: "中型要塞城市，人口约八万，龙脊联邦北部边境关卡"
        种族构成: "龙兽人 65%、狼兽人 10%、熊兽人 5%、人类 10%、精灵 5%、混血种族 5%"
        自然环境: "位于龙脊山脉北段海拔四千米的山隘口，是通往霜境王国的唯一陆路通道。城市建于冰川侵蚀形成的U形谷中，两侧为垂直冰壁，终年酷寒，全年仅夏季短暂解冻。"
        整体氛围:
          春: "积雪仍厚，谷口风力强劲导致体感温度极低，融雪形成冰面湿滑，守卫换岗频繁"
          夏: "短暂解冻期，冰雪部分融化暴露岩石地表，商队通过边境关卡，为全年最繁忙时段"
          秋: "气温骤降，初雪覆盖山隘，商队数量锐减，城市进入越冬准备状态，物资储备加紧"
          冬: "极寒冰封，山隘关闭，全城转入地下空间生活，地面建筑仅留哨兵，氛围封闭沉寂"
        简述: "霜脊是龙脊联邦的北部边境要塞，人口约八万，建于海拔四千米的山隘口。种族以龙兽人（65%）为主，人类与耐寒兽人为辅。城市建于冰川U形谷中，终年酷寒，是连接霜境王国的唯一陆路关卡。主要地点包括北隘关塞、冰封大厅、冰瀑哨塔、雪鹰崖和古冰川通道。"
        地点列表:
          北隘关塞:
            是否城内: true
            方位: "北"
            简述: "扼守山隘口的石质要塞，城墙横跨谷地两端，设有重型城门与魔力炮台，是联邦北部边防的核心关卡。"
          冰封大厅:
            是否城内: true
            方位: "中"
            简述: "建于冰层下的半地下集会大厅，墙壁为天然冰壁，内部以火元素魔晶供暖，是居民越冬期间的主要活动场所。"
          冰瀑哨塔:
            是否城内: false
            方位: "南"
            简述: "建于谷地南端冰瀑布上方的瞭望塔，可监视整条山隘通道，由龙息公会派遣的龙翼哨兵轮值。"
          雪鹰崖:
            是否城内: false
            方位: "西"
            简述: "冰川侵蚀形成的断崖，栖息野生雪鹰群，龙兽人常在此训练幼龙飞行技巧，是城外重要标志性地貌。"
          古冰川通道:
            是否城内: false
            方位: "东"
            简述: "一条被废弃的古代冰下隧道，据传通往深埋于山体内部的上古遗迹，已被龙息议会封锁禁止进入。"
      裂渊:
        城市规模: "中型城市，人口约十万，龙脊联邦东部边境门户"
        种族构成: "龙兽人 55%、鸟兽人 15%、人类 15%、精灵 8%、蛇兽人 5%、混血种族 2%"
        自然环境: "位于龙脊山脉东侧地渊裂隙的上方，城市沿裂隙两岸建造，裂隙宽度约三公里，深度不可测。裂隙中常年吹出上升气流，风力强劲且带有不明魔力波动。周围地表植被稀少，以低矮耐寒灌木为主。"
        整体氛围:
          春: "裂隙气流携带地下暖湿空气上升，两岸雾气弥漫，桥梁表面湿滑，能见度极低"
          夏: "气流最强盛时期，龙兽人利用上升气流进行滑翔飞行训练，城市上空常见龙翼展开的身影"
          秋: "气流减弱，难得晴朗，跨境通商最为便利，东侧原野同盟商队大量涌入"
          冬: "裂隙中喷出的气流携带冰晶与暗色粉尘，全城被黑冰覆盖，桥梁关闭，两岸活动隔离"
        简述: "裂渊是龙脊联邦的东部边境城市，人口约十万，建于地渊裂隙两岸。种族以龙兽人（55%）为主，人类与鸟兽人为辅。城市沿裂隙而建，裂隙中常年上升气流为龙兽人提供天然飞行条件，是通往原野同盟的门户。主要地点包括裂隙大桥、风鸣广场、回声峡谷、云蛇巢地和遗忘阶梯。"
        地点列表:
          裂隙大桥:
            是否城内: true
            方位: "中"
            简述: "横跨地渊裂隙两岸的主桥梁，以黑曜石与魔力钢索建造，宽度可容三头成年龙兽人并行，是城市核心交通枢纽。"
          风鸣广场:
            是否城内: true
            方位: "南"
            简述: "裂隙南岸的开放式集会广场，边缘设有无护栏的观渊台，龙兽人与鸟兽人常在此进行飞行起降，风声穿过广场产生类似笛鸣的天然音效。"
          回声峡谷:
            是否城内: false
            方位: "北"
            简述: "裂隙延伸段的一处分叉峡谷，谷壁对声音有特殊反射效果，冒险者常来此测试与训练声音类技能和魔法。"
          云蛇巢地:
            是否城内: false
            方位: "东"
            简述: "裂隙东岸外的一处高耸岩柱群，野生云蛇筑巢于此，云蛇为低智飞行魔兽，是获取飞行魔兽材料的采集区域。"
          遗忘阶梯:
            是否城内: false
            方位: "南"
            简述: "嵌于裂隙南壁的古代石阶，螺旋向下延伸至裂隙深处，来源与建造者不明，仅前三百级经验证安全，更深处已被龙息议会封禁。"
      雾骸:
        城市规模: "小型城镇，人口约三万，龙脊联邦疗养与社交休憩地"
        种族构成: "龙兽人 45%、人类 20%、狐兽人 10%、猫兽人 8%、精灵 8%、恶魔与魅魔 5%、混血种族 4%"
        自然环境: "位于龙脊山脉中段南坡的地热活跃区，地形为缓坡台地，分布数十处天然温泉和间歇泉，溪流终年温热。周围为低矮灌木和火山草甸，植被因温泉热量而四季常绿。"
        整体氛围:
          春: "温泉蒸汽与山间薄雾交融，各类旅人抵达疗养，城镇氛围松弛"
          夏: "避暑访客涌入，温泉池边社交活动频繁，多种族混浴为常态，整日嘈杂交谈声"
          秋: "访客减少，转为龙兽人氏族内部疗养与休憩时段，城镇节奏放慢，夜间多为静默泡浴"
          冬: "积雪覆盖外部地面，温泉区蒸汽柱在雪地中尤为显眼，少数冬季旅人独享宁静"
        简述: "雾骸是龙脊联邦的疗养与休憩城镇，人口约三万，位于龙脊山脉中段南坡地热活跃区。种族以龙兽人（45%）为主，人类与各兽人亚种比例均衡。城镇围绕数十处天然温泉而建，是联邦主要社交与休养地。主要地点包括中央大温泉池、疗愈浴堂、蒸汽谷、间歇泉地和冥想岩群。"
        地点列表:
          中央大温泉池:
            是否城内: true
            方位: "中"
            简述: "雾骸最大的公共露天温泉，分多层池阶以容纳不同体型种族，水温由地热自动调节，全天对公众开放。"
          疗愈浴堂:
            是否城内: true
            方位: "东"
            简述: "设有围墙和顶棚的半室内温泉设施，混入药草和魔力材料，专门用于战斗损伤恢复与魔力疲劳缓解，由龙息公会疗愈师驻守。"
          蒸汽谷:
            是否城内: false
            方位: "北"
            简述: "温泉密集的狭窄谷地，蒸汽浓度极高，能见度不足五米，地下水中矿物质含量丰富，采集者在此提取温泉矿物。"
          间歇泉地:
            是否城内: false
            方位: "西"
            简述: "分布十余座间歇泉的开放台地，每座喷发周期不同，最大喷发高度可达三十米，是雾骸标志性自然景观。"
          冥想岩群:
            是否城内: false
            方位: "南"
            简述: "由火山岩柱组成的安静区域，远离主要温泉区，龙兽人与精灵常在此进行魔力冥想与精神修行，设有简易石质坐席。"
  霜境王国:
    简述: "霜境王国是位于阿斯特大陆北部的丘陵王国，实行封建君主制，人口约五百万。主体种族为人类（50%），地精、矮人与耐寒兽人混居。自然环境以冰雪覆盖的丘陵与针叶林为主，矿藏丰富。公会名为锻火公会，建筑为厚重的花岗岩尖顶风格，内部设中央壁炉大厅，入口饰以铁砧火焰徽记。"
    自然环境: "全境以低矮丘陵和起伏高原为主，北部沿海为冻土苔原，南部为针叶林带。除夏季（6至8月）外，大部分地区被冰雪覆盖。境内多冰蚀湖泊和冻河，夏季解冻期形成短促的河流网络。矿产资源丰富，尤以铁矿和魔晶矿著称。"
    社会结构: "封建君主制。国王为最高统治者，下设公爵、伯爵、子爵三级贵族分封领地。贵族之下为自由民阶层（工匠、商人、佣兵），最底层为农奴。王都设有「冬炉议会」，由贵族代表与公会代表共同参与民政决策。人口约五百万。"
    种族构成: "人类 50%、地精 20%、矮人 15%、狼兽人 5%、熊兽人 5%、混血种族 5%"
    公会名称: "锻火公会"
    公会风格: "采用厚重的花岗岩砌筑，墙体厚实以抵御严寒，屋顶为陡坡尖顶防止积雪，内部设中央壁炉大厅，入口悬挂铁砧与火焰徽记。"
    城市列表:
      铁砧堡:
        城市规模: "大型城市，人口约一百二十万，霜境王国首都及最大城市"
        种族构成: "人类 55%、地精 20%、矮人 15%、狼兽人 5%、熊兽人 3%、混血种族 2%"
        自然环境: "位于王国中部一处三面丘陵环抱的盆地中，盆地内有地热泉眼形成不冻河，是全境少数冬季不完全封冻的水道。城市围绕不冻河两岸建造，河岸为石砌码头与仓库区，向外扩展为工匠区和贵族区。周围丘陵为针叶林覆盖，冬季积雪可达两米。"
        整体氛围:
          春: "融雪形成泥泞街道，不冻河水位上涨，商船开始通航，建筑工事重启"
          夏: "日照长达十八小时，街道干燥，户外集市与锻造活动达到全年顶峰"
          秋: "冷风从北坡灌入，不冻河出现浮冰，全城加紧囤积过冬物资"
          冬: "白昼仅六小时，街道积雪压实为冰层，室内壁炉全天燃烧，城市转入地下仓储区活动"
        简述: "铁砧堡是霜境王国首都，人口约一百二十万，建于三面丘陵环抱的地热盆地中。种族以人类为主（55%），地精与矮人比例较高。城市绕不冻河而建，是王国政治与锻造工业中心。主要地点包括冬炉王宫、不冻港区、锻火公会总厅、霜卫军营和北风瞭望塔。"
        地点列表:
          冬炉王宫:
            是否城内: true
            方位: "中"
            简述: "国王居所与冬炉议会议事场所，花岗岩建造的矩形堡垒式宫殿，中央大厅设巨型壁炉常年燃烧。"
          不冻港区:
            是否城内: true
            方位: "南"
            简述: "沿不冻河修建的石砌码头与仓库群，是王国主要内陆水运枢纽，冬季仍需破冰船维持航道。"
          锻火公会总厅:
            是否城内: true
            方位: "东"
            简述: "锻火公会的全国总部，花岗岩尖顶建筑，正厅悬挂巨型铁砧徽记，附设面向全大陆冒险者的任务发布板。"
          霜卫军营:
            是否城内: true
            方位: "西"
            简述: "王国近卫军团驻地，训练场终年开放，石墙上记录历代国王的军事功绩浮雕。"
          北风瞭望塔:
            是否城内: false
            方位: "北"
            简述: "建于北侧丘陵顶端的石塔，高四十米，监视北方冰原的魔兽动向与天气变化，由霜卫军团轮值。"
      霜木垒:
        城市规模: "中型要塞城市，人口约十五万，霜境王国西部边境关卡"
        种族构成: "人类 45%、地精 25%、森林精灵 10%、矮人 10%、暗精灵 5%、狼兽人 3%、混血种族 2%"
        自然环境: "位于针叶林与密林交界处的河谷地带，城市跨河而建。河南岸为霜境王国的针叶林，河北岸渐变为密林双廷的巨木森林。周围多雾，河谷两侧为陡峭岩壁，形成天然关隘地形。"
        整体氛围:
          春: "河水解冻，两岸雾气浓重，边境关卡恢复通关，精灵商队开始往返"
          夏: "雾气消散，河谷凉爽，边境贸易最活跃，关卡排队长达数百米"
          秋: "针叶林开始落叶，河北岸密林转为暗红与金色，商队数量减少"
          冬: "河面结冰可直接步行通过，边境关卡关闭，仅保留军事哨岗"
        简述: "霜木垒是霜境王国西部边境要塞，人口约十五万，建于针叶林与密林交界处的河谷。种族以人类（45%）与地精（25%）为主，精灵因边境交流比例高于王国内陆。城市跨河而建，是通往密林双廷的关卡。主要地点包括西境关塞、跨境市集、河卫哨塔、迷踪林缘和古伐木场。"
        地点列表:
          西境关塞:
            是否城内: true
            方位: "西"
            简述: "扼守河谷通路的石质关塞，城墙上设有面向密林方向的魔力侦测阵，查验所有跨境人员身份。"
          跨境市集:
            是否城内: true
            方位: "中"
            简述: "位于河两岸的定期集市，王国矿石与毛皮交换密林双廷的魔法草药与木材，每月逢五开市。"
          河卫哨塔:
            是否城内: true
            方位: "北"
            简述: "建于河北岸的瞭望塔，监视密林方向动向，塔顶常驻烽火台用于紧急传讯。"
          迷踪林缘:
            是否城内: false
            方位: "北"
            简述: "河北岸外的过渡林地，树木开始出现密林双廷特有的魔力苔藓，未设路标区域易迷路，低级冒险者常在此训练野外定向。"
          古伐木场:
            是否城内: false
            方位: "南"
            简述: "河南岸外的一处废弃伐木场，原为两国共管时期的木材加工地，现存大量半腐木料与生锈伐木器械，偶有森林魔兽出没。"
      长风驿:
        城市规模: "中型城市，人口约二十万，霜境王国东部边境贸易枢纽"
        种族构成: "人类 40%、狼兽人 15%、地精 15%、熊兽人 10%、矮人 10%、马兽人 5%、混血种族 5%"
        自然环境: "位于针叶林东缘与草原交界的缓坡地带，龙脉河的一条支流流经城市南侧。地形以低缓丘陵为主，植被从西部的密集针叶林向东逐渐稀疏，过渡为草地和灌木丛。风力常年较大，来自东部平原的气流携带干燥冷空气。"
        整体氛围:
          春: "草原返青，游牧兽人部落开始迁徙，城市周边的临时营地增多，集市日夜不休"
          夏: "干燥炎热，草原扬尘频繁，商队选择夜间赶路白天休整，城市作息昼夜颠倒"
          秋: "游牧部落返程，最后一次大型集市持续七天，食物与毛皮交易量达全年峰值"
          冬: "暴风雪频繁，商路关闭，兽人商队撤回草原深处，城市转为自给休养状态"
        简述: "长风驿是霜境王国东部边境城市，人口约二十万，建于针叶林与草原交界处的缓坡地带。种族以人类（40%）与耐寒兽人（25%）为主，兽人比例全王国最高。城市是连接原野同盟的贸易枢纽。主要地点包括东驿关市、兽人营地、长风驿站、支流渡口和风车丘陵。"
        地点列表:
          东驿关市:
            是否城内: true
            方位: "中"
            简述: "全王国最大的露天集市，专设兽人体型的交易区与拴马桩，常年有原野同盟各部落商队驻扎，货币与以物易物并行。"
          兽人营地:
            是否城内: true
            方位: "东"
            简述: "专为兽人商队设立的临时住宿区，以帐篷和半地下暖窖为主，配备大型公共烤肉架和兽人尺寸的洗浴设施。"
          长风驿站:
            是否城内: true
            方位: "南"
            简述: "官办驿站的东部总站，提供马匹更换、货物仓储和护卫佣兵雇佣服务，是往返王国内陆与东境的中转站。"
          支流渡口:
            是否城内: false
            方位: "南"
            简述: "龙脉河支流上的浅水渡口，春夏以渡船通行，冬季河面结冰后可供马车直接通过，渡口旁设有简易旅店。"
          风车丘陵:
            是否城内: false
            方位: "东"
            简述: "城外东侧的一排低矮丘陵，建有十余座石质风车用于研磨矿石和谷物，是长风驿的地标性地貌。"
      冰湾港:
        城市规模: "中型港口城市，人口约十八万，霜境王国北部主要出海口"
        种族构成: "人类 50%、地精 25%、矮人 10%、狼兽人 5%、熊兽人 5%、混血种族 5%"
        自然环境: "位于王国北部海岸的一处深水湾内，海湾三面为冻土悬崖环绕，湾口向北敞开面对无尽洋。海岸线在夏季解冻期形成天然良港，冬季全湾冰封厚度可达三米。城市沿海湾内侧的缓坡台地而建，周围植被为苔原矮草和地衣。"
        整体氛围:
          春: "海冰开始破裂，船坞复工作业，渔民检修船只，空气中弥漫鱼油和沥青味"
          夏: "全天日照，港口全面运作，捕鱼船队远航北冰洋，加工场昼夜运转"
          秋: "海面开始结冰，船队返港，全城转入渔获腌制与仓储作业，海风刺骨"
          冬: "海面全封，港口停摆，居民转入室内手工与维修作业，夜间常见极光"
        简述: "冰湾港是霜境王国北部出海口，人口约十八万，建于冻土海岸的深水湾内。种族以人类（50%）与地精（25%）为主，有少量耐寒海洋兽人。城市沿海湾缓坡台地而建，夏港冬封。主要地点包括深水港区、鱼获加工场、冰封船坞、苔原猎场和北望灯塔。"
        地点列表:
          深水港区:
            是否城内: true
            方位: "北"
            简述: "沿海湾内侧建造的石砌深水码头群，可停泊大型远洋渔船，设有多座起重吊架和鱼油储存罐。"
          鱼获加工场:
            是否城内: true
            方位: "中"
            简述: "集中处理渔获的大型工坊区，包括熏鱼房、腌鱼窖和鱼油提炼炉，夏季加工旺季雇佣大量临时工。"
          冰封船坞:
            是否城内: true
            方位: "南"
            简述: "冬季专用的室内修船设施，以花岗岩墙体和厚木板顶棚建造，内部设供暖炉，可同时容纳八艘渔船进行维修。"
          苔原猎场:
            是否城内: false
            方位: "西"
            简述: "城外西侧的冻土苔原，栖息雪兔、冰狐和苔原驯鹿，是本地居民冬季狩猎和毛皮来源地。"
          北望灯塔:
            是否城内: false
            方位: "北"
            简述: "建于湾口北侧悬崖顶端的石质灯塔，以魔晶为光源，夏季引导远洋船队入港，冬季转为监视海冰状况。"
      黑脉镇:
        城市规模: "中型矿业城市，人口约十万，霜境王国主要矿产基地"
        种族构成: "矮人 35%、地精 30%、人类 20%、狼兽人 5%、熊兽人 5%、混血种族 5%"
        自然环境: "位于王国南部丘陵地带的矿脉富集区，周边山丘遍布露天和地下矿场入口。地表为针叶林覆盖，因采矿活动部分区域已退化为裸岩和碎石坡。地下矿道系统纵深超过两百米，分为四层开采面，部分矿道延伸至城镇下方。"
        整体氛围:
          春: "融雪渗入地下增加矿道排水压力，矿工全力检修排水设备，地表作业恢复"
          夏: "最佳采矿季，所有矿道全负荷运转，地面选矿场碎石机轰鸣不断，空气中弥漫矿石粉尘"
          秋: "矿产量达到峰值，冶炼炉全天燃烧，夜晚天空被火光映红，精炼金属运往铁砧堡"
          冬: "地表矿场停工，全面转入地下矿道作业，矿工与家属基本不离开地下生活区"
        简述: "黑脉镇是霜境王国主要矿产基地，人口约十万，位于王国南部丘陵矿脉富集区。种族以矮人（35%）与地精（30%）为主体，人类为辅。城市地表与地下双层结构，地下矿道纵深超两百米。主要地点包括深矿井区、地精冶炼坊、矮人锻甲铺、雪松林区和废矿湖。"
        地点列表:
          深矿井区:
            是否城内: true
            方位: "中"
            简述: "城镇中心的主矿井入口集群，设有大型升降机直达地下各层开采面，入口处立有矿石品质检测台。"
          地精冶炼坊:
            是否城内: true
            方位: "东"
            简述: "由地精工匠运营的大型冶炼工坊区，以管道将矿井排出的地热引入熔炉提高冶炼效率，精炼铁、钢和魔晶。"
          矮人锻甲铺:
            是否城内: true
            方位: "西"
            简述: "矮人铁匠集中开设的盔甲店铺街，专门生产重型板甲与盾牌，铺内锻造声持续不断，装备品质享誉全王国。"
          雪松林区:
            是否城内: false
            方位: "北"
            简述: "城外北侧保留的原始雪松林，为矿井提供坑道支撑木材，林间有小径通往废弃的浅层探矿点。"
          废矿湖:
            是否城内: false
            方位: "南"
            简述: "一处废弃露天矿坑因地下水渗出形成的湖泊，水质含高浓度矿物质呈蓝绿色，偶有冒险者前来采集水中特殊藻类。"
  密林双廷:
    简述: "密林双廷是位于阿斯特大陆西部的森林国度，由森林精灵与暗精灵二元共治，人口约三百万。主体种族为森林精灵（35%）与暗精灵（30%），人类与小型兽人为辅。自然环境为原始巨木密林，分布魔力泉眼与地下溶洞。公会名为翠枝公会，建筑与巨树共生，利用活树枝干与藤蔓建造，各分会以树冠吊桥相连。"
    自然环境: "全境被原始密林覆盖，树木高度普遍超过五十米，树冠层遮蔽大部分阳光，地面终年为半阴状态。林中分布有天然魔力泉眼，形成小范围的魔力异常区域。暗精灵聚居的南部森林更为幽暗潮湿，分布有地下溶洞群和荧光菌林。"
    社会结构: "二元共治君主制。国家由森林精灵与暗精灵两个王室共同统治，设有「双叶议会」——森林精灵与暗精灵各占半数席位。两族各自管理内部事务，军事、外交、贸易等全国性事项由双王协商决定。人类与混血种族种族作为自由民存在，无参政权。人口约三百万。"
    种族构成: "森林精灵 35%、暗精灵 30%、猫兽人 8%、狐兽人 7%、人类 10%、混血种族 10%"
    公会名称: "翠枝公会"
    公会风格: "建于巨树之上或与树体共生，主结构利用活树枝干编织而成，辅以藤蔓加固，内部空间为树洞式，照明依赖荧光苔藓和魔力灯。各分会之间通过树冠吊桥网络连接。"
    城市列表:
      叶冕庭:
        城市规模: "大型城市，人口约五十万，森林精灵首都及王室所在地"
        种族构成: "森林精灵 55%、猫兽人 10%、人类 12%、狐兽人 8%、暗精灵 8%、混血种族 7%"
        自然环境: "建于一片古老铁木巨树的树冠层中，距地面四十至六十米。城市横跨两百余棵巨树的树冠，以活树枝干编织的平台、藤蔓悬索桥和树干掏空的建筑为主体。地面层常年阴暗，用作仓储与废弃物处理区。周边分布多条魔力泉眼，为城市魔法设施供能。"
        整体氛围:
          春: "树冠新芽抽发，花粉弥漫，平台湿滑，建筑工匠利用新生藤蔓进行桥梁编织和加固"
          夏: "树冠层日照充足，气温适中，城市社交与文化活动活跃，各树冠广场全日有人交谈和演奏"
          秋: "树叶开始变色脱落，平台被落叶覆盖需定期清扫，居民转入树干室内空间活动增加"
          冬: "树冠裸枝，寒风穿透，多数室外活动停止，居民集中于树干内的保温空间，潮湿阴冷"
        简述: "叶冕庭是森林精灵首都，人口约五十万，建于铁木巨树树冠层中。种族以森林精灵为主（55%），人类与小型兽人为辅。城市横跨两百余棵巨树，地面层作附属用途。主要地点包括翠枝王庭、树冠市集、精灵学院、地泉回廊和落叶猎场。"
        地点列表:
          翠枝王庭:
            是否城内: true
            方位: "中"
            简述: "森林精灵王室的树冠宫殿，以活铁木树干为主体，树枝自然生长为王座框架，四壁嵌魔力水晶为窗。"
          树冠市集:
            是否城内: true
            方位: "南"
            简述: "横跨八棵相邻巨树树冠的大型露天集市，以藤蔓网加固地面，交易魔法草药、精灵织物和外来商品。"
          精灵学院:
            是否城内: true
            方位: "北"
            简述: "森林精灵的魔法与箭术研习场所，建于数棵空心巨树内部，分自然魔法、植物操控和远程武技三个学部。"
          地泉回廊:
            是否城内: false
            方位: "中"
            简述: "树冠层以下地面层的魔力泉眼保护区，以石砌回廊环绕泉眼，泉水用于城市魔法供能和药剂制备。"
          落叶猎场:
            是否城内: false
            方位: "西"
            简述: "城外西侧林间较疏的开阔区，地面堆积厚层落叶，栖息林鹿、影狐等可狩猎魔兽，是新手冒险者训练场。"
      影渊廷:
        城市规模: "大型城市，人口约四十五万，暗精灵首都及王室所在地"
        种族构成: "暗精灵 55%、森林精灵 15%、猫兽人 8%、人类 8%、恶魔与魅魔 7%、混血种族 7%"
        自然环境: "建于南部森林一处直径约五公里的巨型天坑中，城市沿天坑崖壁螺旋向下建造，底部连通地下溶洞群。照明依赖荧光菌藓和魔力水晶灯。天坑底部有地下暗河流经，周边溶洞系统包含钟乳石洞、菌林区和魔力结晶矿脉。天坑上方为密林最幽暗潮湿的区域，树冠层在此处最密。"
        整体氛围:
          春: "天坑内湿度最高，崖壁渗水增多，荧光菌繁殖最盛，全城光照度达全年峰值"
          夏: "洞内气温恒定凉爽，地下河水位下降，暴露部分水下洞穴入口，探索活动频繁"
          秋: "天坑上方落叶坠入形成短暂枯叶雨，坑底空气质量下降需开启通风魔法阵"
          冬: "天坑保温效果显著，城内温度高于地表，少数访客选择此时来访避寒"
        简述: "影渊廷是暗精灵首都，人口约四十五万，建于巨型天坑与地下溶洞中。种族以暗精灵为主（55%），森林精灵与人类为辅。城市螺旋建于天坑崖壁，以荧光菌与魔力水晶照明，地下暗河贯穿。主要地点包括暗影王庭、荧光菌市、暗河码头、钟乳工坊和影之林地。"
        地点列表:
          暗影王庭:
            是否城内: true
            方位: "中"
            简述: "暗精灵王室的溶洞宫殿，建于天坑底部最大溶洞中，墙壁嵌天然紫晶，中央石座为天然钟乳石雕刻。"
          荧光菌市:
            是否城内: true
            方位: "南"
            简述: "天坑南壁荧光菌最密集区域的集市，以人工培育的彩色荧光菌分区照明，交易暗精灵特有矿物与夜行魔兽材料。"
          暗河码头:
            是否城内: true
            方位: "北"
            简述: "天坑底部地下暗河的船运节点，小船可通往城外各处洞穴入口，河壁磷光苔藓提供微光导航。"
          钟乳工坊:
            是否城内: true
            方位: "东"
            简述: "利用溶洞天然空间开设的手工作坊区，特产钟乳石质的魔力增幅器和暗属性武器组件。"
          影之林地:
            是否城内: false
            方位: "中"
            简述: "天坑上方的幽暗密林地表，树冠在此处最密几乎不透光，栖息夜刃豹和影蛾等暗属性魔兽。"
      藤崖渡:
        城市规模: "中型港口城市，人口约十二万，密林双廷主要出海口"
        种族构成: "森林精灵 35%、暗精灵 18%、人类 18%、猫兽人 10%、狐兽人 10%、混血种族 9%"
        自然环境: "位于密林西缘的断崖海岸，原始巨木林在此处直抵海岸断崖边缘。一条天然峡湾切入断崖形成深水港，城市沿峡湾两侧的阶梯状台地而建。海平面以上六十米的断崖面上覆满巨树根系，部分根系穿透崖壁悬垂入海。港口水深浪静。"
        整体氛围:
          春: "海雾频繁沿断崖升腾入林，视野受限，船只靠港依赖魔力导航浮标"
          夏: "海雾消散，海面平静，港口全面运转，渔船与商船往返于全大陆各港口"
          秋: "海风增强，崖顶风力可达烈风级，小型船只停航，仅大型商船出入"
          冬: "持续海风夹带盐霜，崖壁根系结冰，港口运作量减半，渔民转为修理船具和加工鱼获"
        简述: "藤崖渡是密林双廷主要出海口，人口约十二万，建于断崖海岸的峡湾深港中。种族以森林精灵和人类为主（各30%），多族混居。城市沿峡湾阶梯台地而建，巨树根系覆满崖壁。主要地点包括峡湾深港、防波栈桥、崖顶市集、根系小径和潮间洞窟。"
        地点列表:
          峡湾深港:
            是否城内: true
            方位: "中"
            简述: "天然峡湾改造的深水码头群，可停泊远洋商船，码头以崖壁开凿的阶梯通道连接崖顶城区。"
          防波栈桥:
            是否城内: true
            方位: "北"
            简述: "峡湾口以巨木桩和魔力加固建造的防波栈桥系统，削弱外海海浪冲击，桥上兼作入港检查站。"
          崖顶市集:
            是否城内: true
            方位: "南"
            简述: "位于崖顶开阔台地的贸易市场，主要交易从全大陆各港口运来的外大陆商品与精灵木材出口。"
          根系小径:
            是否城内: false
            方位: "东"
            简述: "断崖东侧巨树根系暴露区，根系形成天然阶梯和栈道，可沿根步行从崖顶直达海平面，外侧可垂钓。"
          潮间洞窟:
            是否城内: false
            方位: "北"
            简述: "峡湾北侧潮间带的天然海蚀洞窟群，退潮时可步行进入，产出海藻、贝类和海魔力结晶。"
      林曦塞:
        城市规模: "中型边境城市，人口约十五万，密林双廷东部边境门户"
        种族构成: "森林精灵 35%、暗精灵 15%、人类 15%、龙兽人 10%、猫兽人 8%、狐兽人 7%、蛇兽人 5%、混血种族 5%"
        自然环境: "位于密林东缘与龙脊山脉西麓交界处。此处巨木高度逐渐降低，树冠层开始稀疏，阳光可较多的照射到地面层。城市建于森林与山地的过渡带，部分建筑仍为树冠平台式，部分已转为依山石砌建筑。龙脉河的一条西向支流发源于此区域。"
        整体氛围:
          春: "森林新叶与山雪融水同时出现，溪流水量充沛，龙兽人商队开始翻山抵达，边境市集开张"
          夏: "林间凉爽，山风吹入，两族居民户外活动正常，边境巡逻频繁"
          秋: "山风增强，落叶漫天，龙兽人商队赶在封山前完成最后交易，紧张匆忙"
          冬: "山区降雪，山路关闭，树冠建筑撤空转向地面石砌建筑，城市缩至山谷底部少数街区运作"
        简述: "林曦塞是密林双廷东部边境城市，人口约十五万，建于密林与龙脊山脉交界处。种族以森林精灵（35%）与人类（25%）为主，龙兽人因边境贸易在此有一定比例。城市建筑混合树冠与石砌两种风格。主要地点包括东境哨站、山脚市集、混合工坊、溪源谷和龙望台。"
        地点列表:
          东境哨站:
            是否城内: true
            方位: "东"
            简述: "扼守通往龙脊联邦山道的石砌哨站，设有魔力警报阵，由森林精灵哨兵与龙兽人向导联合执勤。"
          山脚市集:
            是否城内: true
            方位: "中"
            简述: "森林与山麓交界处的贸易集市，交易精灵魔法制品与龙兽人矿石和锻造品，以物易物为主要交易方式。"
          混合工坊:
            是否城内: true
            方位: "南"
            简述: "少数由精灵与龙兽人工匠合作运营的工坊区，生产融合木艺与金属锻造的复合制品，产量低但工艺独特。"
          溪源谷:
            是否城内: false
            方位: "北"
            简述: "龙脉河西向支流的源头山谷，水质富含矿物质且微带魔力，精灵在此培育水生魔法植物。"
          龙望台:
            是否城内: false
            方位: "东"
            简述: "城外东侧一处天然岩石高台，可眺望龙脊山脉全景，台上刻有古精灵与龙兽人盟约的模糊碑文。"
      月泉台:
        城市规模: "中型城市，人口约二十万，双叶议会所在地及两国事协调中心"
        种族构成: "森林精灵 30%、暗精灵 30%、猫兽人 10%、人类 10%、狐兽人 8%、混血种族 12%"
        自然环境: "位于密林地理中心，围绕全境最大的天然魔力泉眼而建。泉眼涌出的水形成一座直径约两百米的浅湖，湖面终年发出微弱的蓝白色魔力荧光。城市以湖为中心向外铺设四层环形城区，外围密林树冠层完好保留，树冠和地面均有通道。泉水被证实具有愈合轻伤和缓解疲劳的效果。"
        整体氛围:
          春: "泉眼流量增大，湖水满溢形成临时小河道，双叶议会春季会期开启，各族代表汇聚"
          夏: "湖水水位稳定，环湖城区成为社交中心，夜间荧光湖面吸引大量访客观赏"
          秋: "泉眼流量减少，湖水边界收缩约五米，议会进入密集审议期，政治活动达全年高峰"
          冬: "湖面雾气浓重，荧光穿透雾气形成扩散光晕，访客稀少，城市转为内部事务处理期"
        简述: "月泉台是密林双廷中立会面地，人口约二十万，围绕全境最大魔力泉眼而建。种族中森林精灵与暗精灵各占30%均衡分布。城市为双叶议会所在地，泉水具有治愈效果。主要地点包括双叶议会厅、环湖城区、翠枝公会中央厅、治愈湖岸和魔力泉源洞。"
        地点列表:
          双叶议会厅:
            是否城内: true
            方位: "中"
            简述: "建于魔力湖正中央的环形议事建筑，一半为木结构代表森林精灵、一半为石结构代表暗精灵，仅以窄桥连接湖岸。"
          环湖城区:
            是否城内: true
            方位: "中"
            简述: "绕湖四层环形街道组成的核心城区，内环为议会与公会区，外环为居民与商业区。"
          翠枝公会中央厅:
            是否城内: true
            方位: "南"
            简述: "翠枝公会全国总部，建于湖岸南侧的巨树冠层中，负责协调全境各城分会的任务分派与冒险者等级评定。"
          治愈湖岸:
            是否城内: false
            方位: "西"
            简述: "湖岸西侧一段水质最纯净的浅滩，官方允许浸泡以愈合轻伤，由公会人员监管以防止污染泉眼。"
          魔力泉源洞:
            是否城内: false
            方位: "北"
            简述: "湖北侧密林中的泉眼发源地洞穴，洞内魔力浓度过高，无防护进入会导致魔力眩晕，仅允许佩戴防护装备的科研人员进入。"
  原野同盟:
    简述: "原野同盟是位于阿斯特大陆东部平原的兽人部落联盟，以部落酋长联盟制共治，由数十个部落组成，人口约八百万。主体种族为各类大型哺乳兽人（虎、狼、狮、马、羊等合计60%），人类与其余兽人亚种为辅。自然环境为温带草原，龙脉河横贯全境。公会名为长风公会，建筑以石材基座加木结构建造，外形受帐篷启发，内部开阔，外围设栅栏哨塔。"
    自然环境: "全境为广袤的温带草原，地势平坦开阔，间或有低矮丘陵和稀疏林地。龙脉河自西向东横贯全境，河道宽阔水流平缓，是主要的水源和交通命脉。沿河两岸形成肥沃的冲积平原带，是主要农耕区。东部沿海为漫长的沙滩海岸线。"
    社会结构: "部落酋长联盟制。全国由数十个以种族亚种为单位的部落组成，每个部落由酋长统领。各部落共同推举一名「大酋长」作为全国最高代表，由各部落酋长在「百酋大会」中每五年选举一次。部落内部以个人武力与狩猎功绩排定地位，社会阶层流动频繁。人口约八百万，是大陆人口最多的国家。"
    种族构成: "虎兽人 20%、狼兽人 15%、狮兽人 10%、马兽人 10%、鸟兽人 8%、人类 12%、羊兽人 5%、爬行兽人 5%、混血种族 15%"
    公会名称: "长风公会"
    公会风格: "以石材基座加木结构主体建造，外形受游牧帐篷启发，屋顶为大穹顶或锥顶，内部空间开阔无柱，墙上悬挂各部落贡献的狩猎战利品和旗帜。建筑群外围设有环形栅栏和哨塔。"
    城市列表:
      百牙原:
        城市规模: "大型城市，人口约两百万，全大陆人口最多的城市，原野同盟首都及百酋大会所在地"
        种族构成: "虎兽人 22%、狼兽人 18%、狮兽人 12%、人类 12%、马兽人 10%、鸟兽人 10%、羊兽人 5%、爬行兽人 3%、混血种族 8%"
        自然环境: "建于龙脉河中段最宽阔的河段两岸，河流在此分叉为三条支流形成天然水系网络。城市无城墙，以河流分支作为各部落区的自然边界。城内建筑以石材基座加木穹顶结构为主，外围设环形栅栏与哨塔群。首都周边为龙脉河冲积形成的全大陆最肥沃农耕区，灌溉水渠密布。"
        整体氛围:
          春: "草原返青，各部族代表沿龙脉河乘船或骑马抵达，百酋大会春季会期开幕，城内空地与河岸挤满临时营帐"
          夏: "龙脉河水量稳定，日间户外炎热但河风凉爽，各部落区沿河举办竞技会，角力与骑射赛事全日不断"
          秋: "百酋大会进入最密集议事期，每五年一次的大酋长选举在此时举行，全城帐篷与旗帜数量达全年峰值"
          冬: "河面部分结冰但未封，北风强劲，大部分部落撤回各自领地，首都保留常驻居民约三分之一，氛围空旷安静"
        简述: "百牙原是原野同盟首都，人口约两百万，全大陆人口最多的城市，建于龙脉河中段三岔河口。种族以大型哺乳兽人为主（55%），人类为辅。城市无城墙，以河流分支为天然分区，是百酋大会和大酋长选举所在地。主要地点包括百酋大会场、长风公会总厅、龙河市集、河滩角斗场和部族大会营。"
        地点列表:
          百酋大会场:
            是否城内: true
            方位: "中"
            简述: "同盟最高议事场所，巨型穹顶建筑内部无一根立柱，可容纳全部落酋长同时列席。穹顶悬挂各部落旗帜，中央设环形议席与发言台。"
          长风公会总厅:
            是否城内: true
            方位: "北"
            简述: "长风公会全国总部，石基木穹建筑，正厅悬挂全大陆最大的狩猎战利品墙，任务板按部落分区发布委托。"
          龙河市集:
            是否城内: true
            方位: "南"
            简述: "沿龙脉河南岸延展的大型露天集市，分设牲畜、皮革、谷物和武器四大交易区，是全大陆畜牧产品最大集散地。"
          河滩角斗场:
            是否城内: true
            方位: "东"
            简述: "龙脉河东岸河滩上开辟的开放式角斗场地，以天然石料砌边，用于部落间竞技比武和冒险者实战训练，观众沿河岸坡地观看。"
          部族大会营:
            是否城内: false
            方位: "西"
            简述: "城外西侧划定的永久性扎营区，可供数十个部落同时搭建营帐，各部落按编号分区驻扎，百酋大会期间全营人口超百万。"
      河鬃渡:
        城市规模: "中型边境城市，人口约十五万，原野同盟西部边境门户"
        种族构成: "马兽人 20%、狼兽人 18%、龙兽人 15%、虎兽人 12%、人类 10%、鸟兽人 8%、混血种族 17%"
        自然环境: "位于龙脉河从龙脊山脉进入平原的峡口地带。此处河道刚出山地，水流较急且河面收窄，两岸为低矮山丘与草地相间。城市建于河南岸的缓坡台地上，是龙脉河进入平原后的第一座城市。周围草被丰茂，因靠近山地水源充足。"
        整体氛围:
          春: "山地融雪汇入河体致水位上涨，部分低岸被淹，龙兽人商队乘上升气流滑翔下山抵达市集"
          夏: "河水流量稳定，山脚凉爽，河面渡船最繁忙，两岸互市摊位延展一公里以上"
          秋: "山风增强，龙兽人商队在隘口封冻前赶运最后一轮矿石，全城加紧囤积过冬金属原料"
          冬: "山隘封闭，龙兽人商队中断，城市转为内向休养，沿河工坊利用库存矿石维持锻造"
        简述: "河鬃渡是原野同盟西部边境城市，人口约十五万，建于龙脉河出山口峡口地带。种族以大型兽人（50%）与龙兽人（15%）为主。城市是龙脊联邦与原野同盟之间的主要贸易通道。主要地点包括西山峡关、跨河石桥、兽龙互市、河源峡谷和风起草原。"
        地点列表:
          西山峡关:
            是否城内: true
            方位: "西"
            简述: "扼守龙脉河出山峡口的石木混合哨站，由长风公会与龙兽人哨兵分管两岸，查验过往商队与行人身份。"
          跨河石桥:
            是否城内: true
            方位: "中"
            简述: "横跨龙脉河的石砌拱桥，宽可容四头骑兽并行，桥面两侧设交易摊位，是全同盟唯一能承受龙兽人体重的跨河桥梁。"
          兽龙互市:
            是否城内: true
            方位: "南"
            简述: "专为龙兽人与兽人贸易设立的市场，龙兽人矿物与锻造品交换兽人皮革、肉类和草原药草，以物易物为主。"
          河源峡谷:
            是否城内: false
            方位: "西"
            简述: "龙脉河出山前的最后一段峡谷，两侧崖壁高达百米，谷内风力强劲且常年潮湿，栖息崖鹰和河蜥等峡谷魔兽。"
          风起草原:
            是否城内: false
            方位: "东"
            简述: "城外东侧一片风力恒定的大面积草场，草被低矮无树木，是鸟兽人起飞训练和马兽人速度竞赛的首选场地。"
      蹄风港:
        城市规模: "中型港口城市，人口约二十五万，原野同盟主要出海口"
        种族构成: "鸟兽人 22%、马兽人 18%、虎兽人 15%、狼兽人 12%、人类 15%、狮兽人 8%、混血种族 10%"
        自然环境: "位于龙脉河入海口处，河流在此分为多条水道形成三角洲湿地后注入无尽洋。港口建在三角洲主水道南岸，为泥沙底浅水港，吃水超过五米的船只无法靠港，远洋大船需在近海锚地由小船接驳。海岸为漫长平缓的沙滩，沙质细白。三角洲湿地为芦苇荡和浅水沼泽，水鸟群集。"
        整体氛围:
          春: "三角洲湿地水鸟迁徙高峰，河道水量充沛航运畅通，河港与海港同时运转"
          夏: "港口最繁忙时段，渔船和商船密集出入，沙滩上晒鱼架连绵数百米，空气中弥漫鱼干和盐渍味"
          秋: "河水量减少，大型货船需减载出入，但远洋商队赶在冬季前涌入完成年度最后采购"
          冬: "三角洲部分浅水区结冰，海面多风浪，港口运作减少，渔获以冰下网捕为主，盐渍作坊转为淡季维护"
        简述: "蹄风港是原野同盟主要出海口，人口约二十五万，建于龙脉河入海三角洲。种族以大型兽人（45%）与人类（30%）为主，海洋兽人有一定比例。港口为泥沙底浅水港，远洋大船需近海接驳。主要地点包括三角洲港区、晒鱼滩、芦苇荡猎场、海风灯塔和河口沙洲。"
        地点列表:
          三角洲港区:
            是否城内: true
            方位: "中"
            简述: "沿三角洲主水道南岸建造的木质栈桥码头群，分河港区和海港区，设有多座岸吊和渔获拍卖台，远洋货船在近海锚地由平底船接驳。"
          晒鱼滩:
            是否城内: true
            方位: "南"
            简述: "港区南侧沙滩上开辟的大型鱼获加工区，木架上晾晒成排河鱼和海鱼，夏季日照加海风可三日脱水完成，附带鱼油提炼锅和腌制地窖。"
          芦苇荡猎场:
            是否城内: false
            方位: "西"
            简述: "三角洲西侧的广阔芦苇荡，浅水区栖息水蜥蜴和沼豚等可狩猎魔兽，需乘平底小船进入，是低中级冒险者的野外试炼地。"
          海风灯塔:
            是否城内: false
            方位: "北"
            简述: "建于三角洲北侧沙洲上的木石混合灯塔，以风元素魔晶供能，光源偏弱但配合沙洲浅滩标志桩共同引导船只避开三角洲暗沙。"
          河口沙洲:
            是否城内: false
            方位: "东"
            简述: "三角洲最外缘的数座移动沙洲，随河水和潮汐不断变形，沙中蕴藏由上游冲刷而来的微量金沙和魔力碎晶，偶有淘金者前来采集。"
      沙角营:
        城市规模: "中型边境城市，人口约十五万，原野同盟南部边境门户"
        种族构成: "狼兽人 22%、马兽人 18%、虎兽人 12%、人类 12%、恶魔与魅魔 10%、蛇兽人 8%、混血种族 18%"
        自然环境: "位于温带草原与半干旱草甸的过渡带，草被自北向南逐渐变疏变矮，砂质土壤比例增加，散生金合欢和刺灌丛。地下水层较浅，城内依靠数口深井和两处天然泉水供水。城市以泉眼为中心向外扩展，周边分布多个游牧部落的固定冬营地。"
        整体氛围:
          春: "草原返青推进至此处最南界，各部落驱赶畜群南下利用短暂绿草期，城市周边临时帐篷数以千计"
          夏: "绿草退至泉眼周边，城市转入节水模式，井口排队取水成常态，社交活动集中在晨昏凉爽时段"
          秋: "沙漠商队北上交易香料与矿物，草原畜群南下出栏，一年中最大型的季节互市持续十五天"
          冬: "旱季，砂地裸露，部分沙漠兽人商队撤返，城市转为小规模交易和冬营地管理，节奏悠缓"
        简述: "沙角营是原野同盟南部边境门户，人口约十五万，建于草原与半干旱草甸过渡带。种族以大型兽人（45%）与沙漠兽人（20%）为主。城市以泉眼为中心而建，是连接金沙帝国的贸易节点。主要地点包括南境围栏、旱草市集、双泉广场、干谷猎场和迁徙瞭望台。"
        地点列表:
          南境围栏:
            是否城内: true
            方位: "南"
            简述: "南部边境的环形木石栅栏哨站，用于管控跨境畜群和商队，设有检疫隔离栏和通关登记台，由各部落轮派守卫。"
          旱草市集:
            是否城内: true
            方位: "中"
            简述: "围绕主泉眼设立的集市，交易草原畜产与沙漠盐、香料和魔力矿物，春秋两季大型互市各持续十五天。"
          双泉广场:
            是否城内: true
            方位: "北"
            简述: "两处相邻天然泉眼改造的公共供水与集会广场，泉水分饮水和畜用分开引渠，是城市日常社交中心。"
          干谷猎场:
            是否城内: false
            方位: "西"
            简述: "城外西侧一条干涸古河谷，谷底沙地中散生仙人掌和沙棘，栖息沙羚和沙狐等荒漠边缘魔兽。"
          迁徙瞭望台:
            是否城内: false
            方位: "东"
            简述: "建于城外东侧高草丘上的木石瞭望塔，高三十米可环视四周数十公里草地与沙地，用于监视野生魔兽群迁徙方向和各部族畜群位置。"
      霜爪垒:
        城市规模: "中型边境城市，人口约十二万，原野同盟北部边境门户"
        种族构成: "狮兽人 22%、马兽人 18%、虎兽人 15%、人类 12%、狼兽人 10%、鸟兽人 8%、混血种族 15%"
        自然环境: "位于温带草原北缘与稀树针叶林交界处的起伏丘陵带。此地草被仍连续但开始间杂矮松和落叶灌木丛。北风常年从霜境王国方向吹来，风力持久且冬季可降至零下。城市建在一处天然避风丘陵南坡，外围以土石矮墙和挡风林带减缓风力。龙脉河北侧支流流经城市东侧。"
        整体氛围:
          春: "北风转为温润，灌木抽芽，霜境王国地精商队通过长风驿南下，边境市集开张"
          夏: "全年风力最弱时段，丘陵绿意最浓，城市外围畜群放牧范围扩展至最北界"
          秋: "北风转冷转强，草被开始枯黄，商队赶在霜境王国隘口封闭前完成最后交易"
          冬: "寒风持续，气温零下但降雪稀少，城市依赖挡风墙和集中供暖穹顶，北部货物交易完全中止"
        简述: "霜爪垒是原野同盟北部边境城市，人口约十二万，建于草原与针叶林交界处的避风丘陵南坡。种族以大型兽人（55%）与人类（25%）为主，有少量耐寒兽人。城市以挡风墙和挡风林带减缓北风，是连接霜境王国的门户。主要地点包括北风哨垒、林缘市集、牧人居落、北溪渡口和风鸣丘。"
        地点列表:
          北风哨垒:
            是否城内: true
            方位: "北"
            简述: "扼守北部丘陵通道的土石混合哨垒，外墙低矮但厚实以抵御强风，设风力魔力警报阵，由长风公会哨兵驻守。"
          林缘市集:
            是否城内: true
            方位: "中"
            简述: "位于城市中央避风处的集市，交易草原畜产与霜境王国矿石和锻冶品，每月逢三开市。"
          牧人居落:
            是否城内: true
            方位: "南"
            简述: "专为耐寒游牧部落设立的固定入冬居落，由半地下暖窖和挡风穹顶建筑组成，冬季可容纳数百人及畜群。"
          北溪渡口:
            是否城内: false
            方位: "东"
            简述: "龙脉河北侧支流上的常规渡口，春夏季以木筏摆渡，冬季河面结薄冰但人畜仍可涉水，是通往霜境王国长风驿的必经之路。"
          风鸣丘:
            是否城内: false
            方位: "北"
            简述: "城外北侧一处光秃的独立圆丘，风力经过丘顶一处天然岩隙时发出持续鸣声，音量随风力增大而增大，是霜爪垒用以估计风速的天然指标。"
  金沙帝国:
    简述: "金沙帝国是位于阿斯特大陆南部沙漠的神权帝国，实行神权君主制，社会阶层固化，人口约六百万。主体种族为沙漠兽人（蛇、阿努比斯、蝎、豺狼等合计55%），恶魔与魅魔及海洋兽人为辅。自然环境为沙漠与绿洲，散落远古神殿遗迹。公会名为金沙公会，建筑为砂岩阶梯金字塔风格，墙体厚重，内部设地下避暑大厅，表面雕刻太阳纹与沙漠图腾。"
    自然环境: "全境以沙漠为主，由流动沙丘区、砾石荒漠区和岩石峡谷区三大地貌组成。沙漠中散布着数十处绿洲，是主要的人口聚居地和农业水源。境内保留有大量远古文明的神殿遗迹和地下陵墓，部分已被流沙半掩。南部沿海为狭窄的岩岸地带，天然港口稀少。"
    社会结构: "神权君主制。皇帝自称太阳神后裔，兼具宗教与世俗最高权力。下设「金袍祭司团」掌管宗教事务和魔法研究，以及「沙卫军团」掌管军事和治安。社会分为祭司贵族、武士、商人、平民、奴隶五个阶层，阶层流动性极低。首都位于最大绿洲之上。人口约六百万。"
    种族构成: "蛇兽人 20%、恶魔与魅魔 20%、蝎兽人 10%、豺狼兽人 10%、阿努比斯兽人 8%、鲨鱼兽人 5%、人类 10%、混血种族 17%"
    公会名称: "金沙公会"
    公会风格: "以砂岩砖砌筑为主，墙体厚重以隔绝热浪，窗户窄小以减少日照。大型建筑采用阶梯金字塔式结构，内部设地下大厅以避暑。建筑表面雕刻太阳纹与沙漠图腾，入口处常设水盆以示对来客的欢迎。"
    城市列表:
      日轮都:
        城市规模: "大型城市，人口约一百五十万，金沙帝国首都"
        种族构成: "蛇兽人 25%、恶魔与魅魔 20%、阿努比斯兽人 18%、蝎兽人 10%、人类 8%、豺狼兽人 5%、混血种族 14%"
        自然环境: "建于全境最大绿洲之上，绿洲湖直径约三公里，湖水来自深层地下含水层终年不涸。城市以湖为中心向外环形扩展，内环为宫殿与神殿区，中环为贵族与祭司宅邸，外环为平民区和市集。绿洲外围为枣椰林和灌溉农田组成的农业带，农业带外即为纯沙漠。"
        整体氛围:
          春: "沙尘暴多发，户外活动减少，神庙举行净化祭祀仪式，街道行人蒙面防沙"
          夏: "白天地表温度可超五十度，街道空无一人，全部活动转入地下大厅，夜间城市恢复运转"
          秋: "全年最温和时段，商队大量抵达，绿洲周边举办收获祭典"
          冬: "昼暖夜寒，外国访客数量达峰值，神殿朝圣者络绎不绝"
        简述: "日轮都是金沙帝国首都，人口约一百五十万，建于全境最大绿洲之上。种族以沙漠兽人为主（50%），恶魔与魅魔比例较高。城市环形布局，中心为绿洲湖，外围农业带与沙漠相隔。主要地点包括太阳王宫、金沙公会总厅、大绿洲市集、沙卫军团要塞和古方尖碑群。"
        地点列表:
          太阳王宫:
            是否城内: true
            方位: "中"
            简述: "皇帝居所与统治中心，建于绿洲湖北岸，砂岩阶梯金字塔式建筑，外墙浮雕太阳神谱系，入口设金箔太阳圆盘。"
          金沙公会总厅:
            是否城内: true
            方位: "东"
            简述: "金沙公会全国总部，金字塔式建筑，大厅设于地下以避暑，入口水盆以魔力维持常满，附设全帝国任务协调中心。"
          大绿洲市集:
            是否城内: true
            方位: "西"
            简述: "沿绿洲湖西岸延展的大型露天集市，分设香料、奴隶、魔法物品和武器盔甲四大交易区，帝国最大商品集散地。"
          沙卫军团要塞:
            是否城内: true
            方位: "南"
            简述: "帝国精锐沙卫军团的中央驻地，砂岩城墙环绕，内部含演武场、军械库和军事议事厅，平民禁止进入。"
          古方尖碑群:
            是否城内: false
            方位: "北"
            简述: "绿洲以北沙漠中矗立的十二根远古方尖碑，每根高逾二十米，表面刻有失落文明的文字与星图，帝国视为圣迹。"
      金帆港:
        城市规模: "大型港口城市，人口约八十万，全大陆最大港口"
        种族构成: "鲨鱼兽人 20%、蛇兽人 18%、恶魔与魅魔 15%、人类 15%、鸟兽人 8%、蝎兽人 5%、豺狼兽人 3%、混血种族 16%"
        自然环境: "位于帝国南部海岸沙漠与无尽洋相接处。一道天然深水湾嵌入岩岸，湾口收窄仅百余米形成天然防波屏障，湾内水域面积极广且水深足够停泊大型远洋船只。港区沿湾展开总长约五公里，分为货运港、渔港、军港和客运港四个专属区域。城市沿港湾后方缓坡建造，水源来自沿海地下淡水层。"
        整体氛围:
          春: "海陆温差产生晨雾，上午港口能见度低依赖魔力灯标导航，午后雾散正常作业"
          夏: "港口旺季，全天二十四小时运转，码头装卸声昼夜不断，外来水手数量远超本地居民"
          秋: "季风增强，远洋航线部分关闭，渔船归港维修，腌制加工坊全力运作"
          冬: "风暴频繁，港口半关闭状态，仅近海航线维持，全城转入船舶修理和货物仓储期"
        简述: "金帆港是全大陆最大港口，人口约八十万，建于沙漠南岸深水湾中。种族以海洋兽人（30%）与人类（25%）为主，多族混居程度大陆最高。港区延展五公里分四区运作。主要地点包括大港区、万国街区、太阳神灯塔、滨海盐田和珊瑚礁浅滩。"
        地点列表:
          大港区:
            是否城内: true
            方位: "北"
            简述: "沿深水湾北岸延展五公里的综合港区，含货运、渔、军、客运四个专属码头群，设有大型起重吊架和仓储仓库群。"
          万国街区:
            是否城内: true
            方位: "中"
            简述: "港区后方专为外籍商人划设的居住与交易区，有潮汐联邦珊瑚石屋、霜境王国石砌旅店和原野同盟帐篷酒馆等各国风格建筑。"
          太阳神灯塔:
            是否城内: true
            方位: "南"
            简述: "建于湾口东侧岬角的巨型灯塔，以太阳魔力水晶为光源，晴夜可视距离达三十公里，是帝国重要导航地标。"
          滨海盐田:
            是否城内: false
            方位: "西"
            简述: "城外西侧海滩开辟的大面积盐田，引海水经日照蒸发结晶产盐，是帝国主要食盐产地之一，盐田呈方格状延展数公里。"
          珊瑚礁浅滩:
            是否城内: false
            方位: "东"
            简述: "湾口东侧近海的大片珊瑚礁区，水下可见度良好，栖息多种浅海魔兽，是海洋兽人渔民的日常作业区和低级冒险者的水下训练场。"
      炎宴城:
        城市规模: "中型城市，人口约四十万，全大陆最大的娱乐与享乐城市"
        种族构成: "恶魔与魅魔 50%、蛇兽人 12%、蝎兽人 10%、人类 8%、豺狼兽人 8%、混血种族 12%"
        自然环境: "建于沙漠中的一处岩石峡谷群内，峡谷深约三十至六十米，谷壁陡峭为城市提供大部分时间遮阴。谷底有地热温泉群涌出，形成局部湿润微气候，峡谷底部终年有绿色植被。建筑大部分凿入峡谷崖壁内部或建于地下，利用岩石的天然隔热性规避地表酷热。峡谷区以外为砾石荒漠。"
        整体氛围:
          春: "气温适中，全大陆游客开始涌入，各娱乐场日间即开门营业，峡谷内人声鼎沸"
          夏: "地表极端高温，全部活动转入地下与崖壁内部空间，各场所二十四小时营业不休"
          秋: "游客数量达到全年峰值，夜间魔力彩灯点亮整条峡谷，街道拥挤程度为全城最高"
          冬: "温度宜人，部分半露天的表演场馆重新开放，年末祭典持续七天"
        简述: "炎宴城是全大陆最大的娱乐与享乐城市，人口约四十万，建于沙漠岩石峡谷群中。种族以恶魔与魅魔为主体（50%），沙漠兽人为辅。城市凿入峡谷崖壁与地下以避暑热，地热温泉维持峡谷底部局部绿带。主要地点包括欢愉宫区、夜光市、丝绒浴堂、影魅剧场和幻烟谷。"
        地点列表:
          欢愉宫区:
            是否城内: true
            方位: "中"
            简述: "峡谷中央最密集的娱乐建筑群，凿入谷壁多层，含酒场、赌坊、浴堂和宴饮厅，由各恶魔氏族经营，二十四小时营业。"
          夜光市:
            是否城内: true
            方位: "南"
            简述: "魅魔经营的夜间专属集市，日落后开放，以彩色魔力灯分区照明，交易催情药剂、稀有香水、异域织物和成人魔法道具。"
          丝绒浴堂:
            是否城内: true
            方位: "东"
            简述: "利用峡谷温泉建造的大型浴堂群，分公共池、私室池和混合池三种规格，水温自动由地热调节，附带按摩与魔力舒缓服务。"
          影魅剧场:
            是否城内: true
            方位: "北"
            简述: "凿于峡谷北壁的大型半圆形剧场，以魔力幻术编排剧目，上演冒险传说、情恋戏剧和魅惑之舞，可容纳三千观众。"
          幻烟谷:
            是否城内: false
            方位: "西"
            简述: "峡谷西侧一条支谷，地裂隙中渗出含魔力成分的彩色烟雾，吸入后产生轻度幻觉，帝国法律规定成年人可在监管下进入体验。"
      砂碑关:
        城市规模: "中型边境城市，人口约十二万，金沙帝国西部边境关卡"
        种族构成: "豺狼兽人 22%、蛇兽人 18%、恶魔与魅魔 18%、蝎兽人 10%、森林精灵 10%、人类 8%、暗精灵 5%、混血种族 9%"
        自然环境: "位于沙漠西缘与密林交界处的砾石丘陵带。此地沙漠与森林之间无渐变过渡，以一条从丘陵泉眼流出的小溪为大致分界线，溪北为密林巨木，溪南为荒漠砾石。城市建于溪南侧的岩质高地上，建筑为砂岩砌筑，可眺望溪北密林。周围地形以矮丘和干谷为主，散生金合欢和刺灌。"
        整体氛围:
          春: "沙漠侧偶发沙尘暴，密林侧雾气沿溪蔓延入城，边境关卡能见度低但通关不中断"
          夏: "干热气流从沙漠涌来，与林地湿气在城上空形成局部积云，偶有短暂降雨"
          秋: "全季最宜人，精灵商队频繁过境，溪边临时摊位延展近百米"
          冬: "气温降但不至冰点，部分密林魔兽会越过浅溪进入沙漠侧觅食，狩猎队加强巡防"
        简述: "砂碑关是金沙帝国西部边境城市，人口约十二万，建于沙漠与密林交界处的砾石丘陵。种族以沙漠兽人（45%）为主，精灵因边境交流有较高比例。城市以界溪与密林双廷分隔。主要地点包括西境关垒、界溪市集、混地训练场、界源泉和石化森林。"
        地点列表:
          西境关垒:
            是否城内: true
            方位: "西"
            简述: "扼守通往密林双廷通道的砂岩堡垒，设有魔力侦测阵，由沙卫军团与密林哨兵分开设岗双向查验过境人员。"
          界溪市集:
            是否城内: true
            方位: "中"
            简述: "沿界溪南岸设立的跨境贸易集市，沙漠矿物与香料交换精灵木材与魔法制品，每月逢十开市。"
          混地训练场:
            是否城内: true
            方位: "南"
            简述: "沙漠侧的一片由砂地与散生灌木组成的开阔训练场，用于训练在林地与荒漠混合环境中的作战能力。"
          界源泉:
            是否城内: false
            方位: "北"
            简述: "界溪源头处的天然泉眼，位于密林侧距关垒约两公里，水质清澈，两国协议共管泉眼周边为中立区。"
          石化森林:
            是否城内: false
            方位: "东"
            简述: "城外东侧一片远古森林因魔力灾害完全石化的遗址，数千根石质树干矗立如林，是帝国境内知名的地貌奇观。"
      烈风驿:
        城市规模: "中型边境城市，人口约十五万，金沙帝国东部边境门户"
        种族构成: "蛇兽人 22%、恶魔与魅魔 18%、虎兽人 12%、人类 10%、狼兽人 10%、蝎兽人 8%、豺狼兽人 5%、马兽人 5%、混血种族 10%"
        自然环境: "位于沙漠东缘与温带草原交界的半干旱草甸带。沙漠在此处渐进式过渡为草原，砂土中开始出现耐旱草被，每隔数公里出现一丛刺灌木，再向东灌木渐密直至成为连续草地。城市北侧有一条季节性河流，春季融雪时水量充沛，夏季断流为散水坑。城市沿河岸南侧建造。"
        整体氛围:
          春: "季节河有水，草原返青，原野同盟各部落牧民赶着畜群南下互市，城外临时营地铺展数公里"
          夏: "河流彻底干涸为水坑链，日间酷热全城转入地窖活动，交易量减少但未中断"
          秋: "凉风从草原吹入，商队赶在入冬前完成最后一轮大宗交易，气氛忙碌紧凑"
          冬: "昼短夜长，城外草原一片枯黄，零星冬季旅人抵达，城市氛围安静"
        简述: "烈风驿是金沙帝国东部边境城市，人口约十五万，建于沙漠与草原交界处的半干旱草甸带。种族以沙漠兽人（40%）为主，大型哺乳兽人因边境交流比例明显。城市沿季节河南侧而建，是连接原野同盟的贸易门户。主要地点包括东沙驿站、草原互市场、季节河床、草原猎场和沙草瞭望塔。"
        地点列表:
          东沙驿站:
            是否城内: true
            方位: "中"
            简述: "帝国官方设立的东部边境总驿站，提供骆驼与马匹更换、货物临时仓储和沙漠向导雇佣，附设可容纳五百人的旅店。"
          草原互市场:
            是否城内: true
            方位: "东"
            简述: "专为原野同盟部落设立的露天互市，以畜产品、毛皮和乳制品交换沙漠盐、香料和魔力矿物，春秋两季大型互市各持续十日。"
          季节河床:
            是否城内: false
            方位: "北"
            简述: "城外北侧的季节性河流，春季有水流时两岸形成临时绿草带，夏季干涸为水坑链时河床可步行通过，成为跨境捷径。"
          草原猎场:
            是否城内: false
            方位: "东"
            简述: "城外东侧草甸带的狩猎区域，栖息草原羚、沙鸵和疾风狼等草原兽类，是边境居民补充肉食和获取皮革的主要来源。"
          沙草瞭望塔:
            是否城内: false
            方位: "南"
            简述: "建于城外南侧高丘上的石质瞭望塔，可同时监视沙漠方向与草原方向的动向，由金沙公会派遣哨兵驻守。"
  潮汐联邦:
    简述: "潮汐联邦是位于阿斯特大陆南部海域的群岛国家，由数十座火山岛与珊瑚岛组成，以松散岛邦联盟制治理，各岛邦高度自治，人口约二百万。主体种族为各类海洋兽人（鲨鱼、鱼类、龟、章鱼等合计60%），人类与恶魔魅魔为辅。自然环境为热带群岛与珊瑚礁海域。公会名为潮音公会，建筑以珊瑚石和贝壳灰岩建造，部分架空于浅海之上，以栈桥相连，屋顶覆以棕榈叶或海草。"
    自然环境: "由三座大型火山岛和数十座小型珊瑚岛组成，岛屿之间以浅海和珊瑚礁相隔。大岛上有活火山和热带雨林，小岛多为珊瑚沙洲。周围海域水温常年温暖，海洋生物多样性极高，近海分布有大量水下洞穴和沉船遗迹。海况受季节风影响明显，夏季为航海旺季，冬季风暴频繁。"
    社会结构: "松散岛邦联盟制。每个主要岛屿为一个独立岛邦，由岛主（世袭或选举产生）统治。各岛邦共同组成「潮汐议会」，负责协调航海贸易、海盗清剿和外交事务。议会议长由各岛主轮流担任，任期一年。岛邦内部管理高度自治，无统一法律体系。人口约二百万。"
    种族构成: "鲨鱼兽人 20%、鱼兽人 15%、龟兽人 10%、章鱼兽人 10%、人类 10%、恶魔与魅魔 10%、贝类兽人 5%、鸟兽人 5%、混血种族 15%"
    公会名称: "潮音公会"
    公会风格: "以珊瑚石和贝壳灰岩为主要建材，建筑部分或全部架空于浅海之上，以木桩或石柱支撑，通过栈桥与陆地相连。屋顶以棕榈叶或海草覆盖，结构轻巧以抵御风暴。"
    城市列表:
      汐音屿:
        城市规模: "大型城市，人口约八十万，潮汐联邦首都及潮汐议会所在地"
        种族构成: "鲨鱼兽人 18%、鱼兽人 15%、恶魔与魅魔 15%、人类 15%、龟兽人 10%、章鱼兽人 8%、贝类兽人 4%、混血种族 15%"
        自然环境: "建于最大火山岛南岸的天然深水环礁湖旁，环礁湖直径约四公里，外围珊瑚礁环形成天然防波堤。城市一半建于陆地上为政务与贸易区，另一半以木桩和石柱架于湖上为居住区和公会区，两部分以栈桥网络连接。环礁湖内水深十至三十米，水质清澈。岛屿内陆为热带雨林覆盖的火山锥。"
        整体氛围:
          春: "海况平稳，水温回暖，环礁湖内鱼群数量增加，各岛邦代表乘船抵达参加潮汐议会春季会期"
          夏: "航海旺季，环礁湖内外船只密集，市集交易量达全年峰值，湖面夜间反射城市灯火形成星光倒影"
          秋: "风向多变，小型渔船减少出海次数转为近岸作业，潮汐议会进入密集议事期审议年度贸易协议"
          冬: "风暴频繁但环礁湖内因珊瑚礁保护浪平，多数船只泊入湖内避风，全城转入船舶维修和社区内部活动"
        简述: "汐音屿是潮汐联邦首都，人口约八十万，建于最大火山岛的天然环礁湖旁。种族以海洋兽人为主（55%），人类与恶魔魅魔为辅。城市半陆半水以栈桥相连，环礁湖为天然良港，潮汐议会在此议事。主要地点包括潮汐议会厅、潮音公会总厅、环礁市集、外洋钓场和珊瑚浅湾。"
        地点列表:
          潮汐议会厅:
            是否城内: true
            方位: "中"
            简述: "潮汐联邦最高议事场所，建于环礁湖正中央的桩基平台上，圆形开放式建筑无围墙，各岛邦代表按岛邦旗帜分区落座，议长席可旋转以面向不同方向。"
          潮音公会总厅:
            是否城内: true
            方位: "东"
            简述: "潮音公会全国总部，建于环礁湖东侧的珊瑚石建筑，部分悬于水上附设潜水出入平台供海洋兽人直接游入，负责协调全联邦冒险者任务和等级评定。"
          环礁市集:
            是否城内: true
            方位: "南"
            简述: "沿环礁湖南岸栈桥建造的水上集市，摊位一半在栈桥上、一半以小船载货泊于桥边交易，主要交易海鲜、珍珠、珊瑚制品和航海物资。"
          外洋钓场:
            是否城内: false
            方位: "南"
            简述: "环礁湖外南侧的大洋垂钓区，水深数十至百米，栖息大型洄游鱼种和浅层大洋魔兽，是中级冒险者水上训练和垂钓获取食材的区域。"
          珊瑚浅湾:
            是否城内: false
            方位: "西"
            简述: "环礁湖西侧一处水浅见底的小湾，海水透明度极高，彩色珊瑚密集，海洋兽人儿童和幼体在此学习游泳和初级魔力掌控，禁止捕猎。"
      蓝渊礁:
        城市规模: "中型海底城市，人口约十五万，全大陆唯一完全建于水下的城市"
        种族构成: "鲨鱼兽人 25%、鱼兽人 20%、章鱼兽人 15%、龟兽人 10%、贝类兽人 10%、恶魔与魅魔 10%、混血种族 10%"
        自然环境: "建于海平面以下三十至八十米的一座巨型古珊瑚礁体上，珊瑚礁体南北长三公里、东西宽两公里，历经千年生长已固化为坚硬礁岩。城市凿入和依附礁体建造，以发光珊瑚、荧光藻和魔力水晶提供照明。空气呼吸者须佩戴水息魔具或服用水下呼吸药剂方可进入。陆上居民通过由龟兽人操控的潜水钟升降舱和魔力浮标通道往来。"
        整体氛围:
          春: "水温回暖，海流携带浮游生物过境，荧光藻大量繁殖致全城照明度上升，能见度增加"
          夏: "水温适宜，城市最活跃时段，各族访客通过潜水钟大批抵达观光与贸易，街道人流密度全年最高"
          秋: "海流方向改变，浮游生物减少导致灯光略微变暗，部分远洋海洋兽人出海进行年度洄游狩猎"
          冬: "海表风暴对水下无影响，全城最宁静时段，转为内部建设和维修，少数陆上访客此时前来避寒"
        简述: "蓝渊礁是全大陆唯一完全建于水下的城市，人口约十五万，建于三十至八十米深的巨型古珊瑚礁体上。种族以海洋兽人为主体（85%）。以荧光生物与魔力水晶照明，陆上访客须借助水息魔具或潜水钟进入。主要地点包括珊瑚王庭、荧光中央街、海底温泉区、沉船墓场和深渊裂口。"
        地点列表:
          珊瑚王庭:
            是否城内: true
            方位: "中"
            简述: "蓝渊礁的行政管理中心，凿于礁体中央最大珊瑚洞窟中，洞壁经千年珊瑚自然生长后人工打磨为半透明宫壁，内部设环形会议沙盘。"
          荧光中央街:
            是否城内: true
            方位: "中"
            简述: "礁体顶部的主要通道，两侧以发光珊瑚柱界路，沿途为店铺与工坊洞穴入口，是全城唯一可供陆上访客直立行走的主干道。"
          海底温泉区:
            是否城内: true
            方位: "东"
            简述: "礁体东侧一处海底地热裂隙涌出温泉的区域，水温显著高于周边海水，多种族在此浸泡和社交，附设由贝类兽人经营的水下休憩所。"
          沉船墓场:
            是否城内: false
            方位: "北"
            简述: "礁体北侧外一处沉积着数十艘不同年代沉船的海底沙地，船只残骸被海藻和珊瑚覆盖，是水下冒险者的常见探索点。"
          深渊裂口:
            是否城内: false
            方位: "南"
            简述: "礁体南侧边缘外的一条海床裂缝，宽度约十米，深度未知，裂缝外沿设有警示浮标，传言裂缝深处连通远古水下遗迹，潮汐议会列为管制区域。"
      扬帆湾:
        城市规模: "中型港口城市，人口约二十五万，潮汐联邦主要对外航运枢纽"
        种族构成: "鲨鱼兽人 20%、人类 18%、恶魔与魅魔 15%、鱼兽人 12%、龟兽人 8%、章鱼兽人 5%、贝类兽人 5%、混血种族 17%"
        自然环境: "建于第二大火山岛的东侧迎风海岸，天然深水湾湾口开阔，水深可容纳大型远洋船只直接靠港。城市沿湾岸的弧形坡地而建，建筑以珊瑚石为主，屋顶覆棕榈叶或海草。岛屿内陆为热带雨林，雨林向海岸延伸至距岸边约五百米处。"
        整体氛围:
          春: "海况稳定，远洋航线全面开启，各大陆商船陆续到港，码头装卸昼夜轮班"
          夏: "航海全盛期，港内泊位全满，外来水手数量激增，临时摊贩遍布码头周边至深夜"
          秋: "远洋船队加快进出港节奏以赶在风暴季前完成航行，港口运作达到最高强度"
          冬: "季风风暴侵袭，远洋航线大部分关闭，仅近海和群岛间航线维持，码头转为船只维修和仓储"
        简述: "扬帆湾是潮汐联邦主要对外航运枢纽，人口约二十五万，建于第二大火山岛的深水湾。种族以海洋兽人（40%）与人类（30%）为主，多族混居。港口可停泊大型远洋船只，是联邦连接大陆的主要门户。主要地点包括深湾港区、万旗码头、修船坊群、风暴瞭望崖和近海拖网区。"
        地点列表:
          深湾港区:
            是否城内: true
            方位: "中"
            简述: "沿深水湾岸建造的珊瑚石码头群，可同时停泊三十余艘远洋商船，设有大型岸吊和中转仓库，是联邦货物进出口的核心港区。"
          万旗码头:
            是否城内: true
            方位: "南"
            简述: "专为外籍船只划设的国际码头区，每个泊位插有所属国旗帜，岸上附设各国商人自建的交易铺面与仓储。"
          修船坊群:
            是否城内: true
            方位: "北"
            简述: "集中修造船只的工坊区，由龟兽人和章鱼类兽人船匠主导，利用火山地热烘干木材和弯曲船板，拥有全联邦最大的干船坞。"
          风暴瞭望崖:
            是否城内: false
            方位: "东"
            简述: "湾口东侧海岸的一处高崖，崖顶建有风暴预警站，由鸟类兽人哨兵根据海鸟行为和气压变化提前数小时预报风暴登陆。"
          近海拖网区:
            是否城内: false
            方位: "西"
            简述: "湾外西侧的大面积近海渔场，海水深度适中，以大型拖网船队作业为主，是扬帆湾居民的主要食用鱼来源地。"
      焰岛:
        城市规模: "小型城市，人口约十万，潮汐联邦矿业与地热能源基地"
        种族构成: "鲨鱼兽人 22%、恶魔与魅魔 18%、鱼兽人 15%、龟兽人 12%、人类 10%、章鱼兽人 8%、贝类兽人 5%、混血种族 10%"
        自然环境: "建于第三大岛的活火山南麓海岸，岛屿中央的活火山每隔数十年有一次温和喷发，火山碎屑堆积形成富含矿物的黑色沙滩与肥沃土壤。海岸线上分布地热蒸汽喷口和海底温泉。周围海底多熔岩管洞窟和热液喷口，是独特的深海生态区。城镇沿山麓的缓坡台地而上，外围挡风石墙保护建筑免受偶尔的火山灰落。"
        整体氛围:
          春: "季节性雨量充沛冲刷火山灰入海，近海海水因矿物富集呈绿黑色，火山活动监测频率增加"
          夏: "旅游与考察访客最多，黑砂滩温泉浴场人满为患，火山向导带领团队攀登至半山安全线"
          秋: "地热蒸汽产量最稳定，锻造工坊全产能运转加工从黑脉镇和灼鳞进口的金属"
          冬: "风暴携带海盐与火山灰混合形成泥雨，户外活动减少，转向地下熔岩管内的加工与温泉维护"
        简述: "焰岛是潮汐联邦矿业与地热能源基地，人口约十万，建于活火山南麓海岸。种族以海洋兽人（50%）为主，恶魔与魅魔比例较高。活火山提供地热锻造能源，海岸多黑砂滩与海底温泉。主要地点包括地热锻冶区、黑砂滩温泉群、硫磺采集礁、熔岩管洞穴和火山口监测哨。"
        地点列表:
          地热锻冶区:
            是否城内: true
            方位: "中"
            简述: "利用火山地热蒸汽驱动的大型锻造工坊区，以管道将地热导入熔炉，专门加工从大陆进口的原矿为成品金属与武器组件。"
          黑砂滩温泉群:
            是否城内: true
            方位: "南"
            简述: "海岸南侧黑砂滩上由海底热液形成的天然温泉群，十余个温泉池散布海滩，水温梯次从温热到沸腾，是全联邦知名疗养地。"
          硫磺采集礁:
            是否城内: false
            方位: "东"
            简述: "城东海中由火山硫磺沉积形成的浅水礁区，采集硫磺用于炼金和魔法材料，采集者需佩戴防护装备。"
          熔岩管洞穴:
            是否城内: false
            方位: "北"
            简述: "山腰北侧由古代熔岩流形成的管状洞穴系统，内部恒温且有细流，部分洞段栖息火元素蝙蝠和熔岩蜗兽等火山魔兽。"
          火山口监测哨:
            是否城内: false
            方位: "北"
            简述: "建于火山锥半山腰的监测站，由恶魔族火系魔法师与龟兽人地质员驻守，监测火山气体与震动活动，半山以上禁止一般人员进入。"
      珊链屿:
        城市规模: "小型群岛度假城镇，人口约八万，全大陆最知名的海岛观光度假胜地"
        种族构成: "鲨鱼兽人 22%、人类 18%、恶魔与魅魔 15%、鱼兽人 12%、章鱼兽人 10%、龟兽人 5%、贝类兽人 5%、混血种族 13%"
        自然环境: "由十二座较大珊瑚岛和近五十座微型沙洲组成的珊瑚岛链，呈弧形自北向南排列，总长约一百二十公里。主城镇建于其中五座较大岛屿上，五岛之间以装饰性珊瑚石拱桥和棕榈木栈道相连。岛链外侧珊瑚礁环形成天然防波屏障，环内泻湖水面终年平稳如镜。各岛植被为热带椰林与花卉灌木，白沙滩总长达三十余公里。"
        整体氛围:
          春: "全岛链气候最温和时段，海面如镜泻湖水质最佳，各大陆游客乘船抵达，度假设施全面开放"
          夏: "旺季高峰，度假宫区客满需预约，海滩与泻湖上各色帆伞与小船密布，夜间海滩篝火与露天宴饮持续至凌晨"
          秋: "游客数量回落，转为氛围更私密的小团体度假，水疗和休闲服务项目成为主流"
          冬: "风暴季外海大浪被礁环消减，泻湖内仍可安全游泳，度假宫区利用淡季进行设施维护与升级，少数冬季避寒游客享受低密度服务"
        简述: "珊链屿是潮汐联邦乃至全大陆最知名的海岛观光度假胜地，人口约八万，由十二座珊瑚岛和五十余座沙洲组成。种族多元以海洋兽人（45%）和人类（30%）为主。五座主岛以珊瑚石拱桥相连，外围礁环保护泻湖终年平稳。主要地点包括珊瑚度假宫区、白沙主滩、栈桥餐饮街、环礁潜游区和日落观景崖。"
        地点列表:
          珊瑚度假宫区:
            是否城内: true
            方位: "中"
            简述: "建于五岛中央主岛的豪华度假建筑群，以珊瑚石、贝壳灰岩和棕榈木建造，含多档客房从标准间到独立水上别墅，附设多族型态的公共浴池和魔力温控泳池。"
          白沙主滩:
            是否城内: true
            方位: "南"
            简述: "延展约五公里的连续白沙滩，沙质细白由珊瑚碎屑经千年研磨形成，滩上设帆伞、冲浪板和水上坐骑租赁点，沿岸浅水区设防鲨魔力网。"
          栈桥餐饮街:
            是否城内: true
            方位: "东"
            简述: "东侧泻湖上以木栈桥连接的一排水上餐馆与酒吧，每家以不同大陆或种族的菜系为特色，夜间以彩色魔力灯装饰栈桥扶栏。"
          环礁潜游区:
            是否城内: false
            方位: "西"
            简述: "泻湖西侧礁环内侧的划定潜游水域，水深三至十五米，水下可见彩色珊瑚、热带鱼群和驯养的海马坐骑，由海洋兽人向导带领潜游。"
          日落观景崖:
            是否城内: false
            方位: "北"
            简述: "北端沙洲上一座低矮珊瑚岩崖，崖顶铺设观景平台和露天吧台，面朝无尽洋正对日落方向，是珊链屿最知名的落日观赏点。"
