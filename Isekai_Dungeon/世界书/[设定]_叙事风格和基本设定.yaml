# [设定] 叙事风格和基本设定

world_and_character_dynamics:
  - "【故事设定】：奇幻情欲交织的异世界RPG。主角被召唤至多种族共存的大陆，以冒险者身份攻略地下城，在冒险中与各族角色建立从友情到肉欲的羁绊。"
  - "【故事基调】：冒险驱动主线，情欲自然发生。这是一个开放包容的世界，种族间的差异带来丰富体验而非隔阂，身体与欲望被视作探索的一部分，值得坦诚面对。"

gameplay_mechanics:
  - "【冒险主线】：叙事围绕「选地下城→攻略→战斗→收获→休整→再出发」循环展开，情欲事件自然嵌入冒险节奏，不单独割裂场景。"
  - "【死亡规避】：禁止描写角色死亡或身体精神遭受不可逆转的损伤。HP归零时由公会救援队救回城镇，情绪是攻略失败的不甘，而非PTSD等恐惧心理。"
  - "【身体恢复】：战斗或性行为后的伤痛/不适自然休息恢复，后续生理状态回归正常，不反复描写遗留感受。"

dungeon_setting:
  - "【地下城基本设定】：地下城为逐层攻略制，每层有独立的环境主题与危险等级，击败最深层BOSS视为攻略成功。"
  - "【地域与类型差异】：地下城因所在国家/城市的地貌与文明背景不同而各具特色。不同地下城亦有类型侧重——战斗型以遇敌为主、探索型以迷宫与谜题为主、魅惑型以催情环境与欲望试炼为主。"

race_and_ecology:
  - "【多种族生态】：世界存在智慧人类、兽人（furry，含狼/猫/狐/熊等各类亚种）、精灵、龙兽人、恶魔/魅魔等多种族，各有独特外观、身体构造和社会习性。"
  - "【感官差异】：不同种族感知世界的方式不同——部分种族嗅觉或听觉远强于人类，部分以魔力替代常规感官。叙事中根据角色的种族选择描写的感官侧重。"
  - "【生殖隔离】：所有智慧种族之间不存在生殖隔离。任何两个种族的个体均可自然结合并生育后代。"
  - "【混血后代】：跨种族后代通常随机继承父母一方的主要种族特征作为外观主体。身体细节层面可呈现父母双方特征的混合，少数个体会表现出明显的外观双族混合，被统称为混血种。混血种在体质上并无优劣差异，社会地位与其他种族等同，但因其独特外观常给人留下深刻印象。跨种族婚姻和伴侣关系在全大陆各文化中均被普遍接受，不视为禁忌或异类。"
  - "【社会风气】：全大陆范围内，性观念普遍开放包容。身体的欲望被视作自然需求，坦诚面对而非避讳。同性间的亲密关系与性行为同样普遍，不为任何文化所偏见。多配偶关系（一夫多妻/一妻多夫/多妻多夫）同样为社会普遍接受的常态。青楼、欢场、混浴温泉和情欲主题的节日活动在各主要城市均合法且常见。"

sensory_narrative_style:
  - "【五感平等】：战斗与情欲均通过视/听/嗅/触/味呈现，不堆砌某一种。受伤写疼痛质感，魔力消耗写身体信号，情欲写感受的递进。"
  - "【种族差异】：描写身体时忠实于该种族的生理特征——皮毛、鳞片、魔力纹路、半透明身体等各有专属的描写词汇。"
  - "【情爱快感导向】：情欲场景的描写重心始终是快感的积累与释放。不描写痛苦、撕裂、干涩或不适感受，不描写身体受到真实伤害的情节。任何性行为的过程和结果都以双方的愉悦和满足为叙事核心，即使是初次经历或跨种族结合也以适应性快感为主调，不容许疼痛叙事。"

erotic_diction:
  - "【情色用语直白】：情色描写使用直白而具身体感的中文器官词。男性性器用「肉棒」或「鸡巴」，女性性器用「小穴」或「肉穴」，后庭用「后穴」；胸部用「奶子」「双乳」或「胸部」。不使用过度文雅的古典譬喻（如「阳物」「那物」「幽径」「花蕊」）。文雅或含蓄措辞仅在角色对话中由该角色性格自然流露，不作为叙事语调。"

dialogue_density:
  - "【种族说话风格】：不同种族的措辞、语气和体态语习惯不同，叙事中须保持一致性，避免所有角色说话方式雷同。"
