# [世界舞台] 汐见沢町地图与概况
world_setting:
  overview: "一座时光流转缓慢的半封闭乡间小镇。小镇以中央镇区为中心，西临大海，东靠群山，分为五个各具特色的区域。"
  
  regions:
    - region: "【西侧：海滨与港口】"
      vibe: "耀眼、青春、潮湿海风"
      locations: 
        - name: "早乙女家公共区域"
          desc: "距离海边很近的阳光现代住宅，院子里常晾晒着运动服和泳衣，充满健康的荷尔蒙气息。"
        - name: "海斗的房间"
          desc: "随意摆放着内衣物，充满阳光气息的凌乱房间。"
        - name: "夏海的房间"
          desc: "堆放运动器材，散发薄荷香气的健康少女房。"
        - name: "海水浴场"
          desc: "白天挥洒汗水与展示泳装的耀眼沙滩，夜晚则是听着海浪声幽会的僻静之地。"
        - name: "防波堤与废弃灯塔"
          desc: "黄昏时分染上橘红色的浪漫地点，海风湿黏，适合发生一些擦边的秘密谈话。"
        - name: "海滨旧仓库"
          desc: "阴凉、堆满渔具的杂物间，平时无人问津，是个绝佳的避暑角落。"

    - region: "【东侧：御神山与深林】"
      vibe: "神秘、清幽、林间蝉鸣"
      locations:
        - name: "御神山神社公共区域"
          desc: "位于长长青苔石阶之上的古老神社。阴凉静谧。庄严肃穆的正殿与宽敞的社务所，连通着打扫得干干净净的庭院。"
        - name: "莲的房间"
          desc: "灰黑色调，藏着猫咪周边、可爱玩偶和女装的整洁单间。"
        - name: "乐奈的房间"
          desc: "堆满游戏碟片与空酒瓶，凌乱且慵懒的巫女卧室。"
        - name: "祭典广场"
          desc: "位于去往神社半途的开阔平地。夏日祭典的举办地，夜晚会挂满灯笼。"
        - name: "山顶观景台"
          desc: "能够俯瞰整个汐见沢町与闪耀海岸线的木制平台。夜晚偏僻且浪漫，是绝佳的星空与烟火观赏点。"
        - name: "希克的秘密基地"
          desc: "深林中一处隐秘的树洞或废弃木屋，充满大自然的气息与野性，是希克最安心的领地。"
        - name: "清凉溪流"
          desc: "树荫遮蔽的山间浅溪，水质清澈冰凉。"

    - region: "【中央：核心镇区】"
      vibe: "怀旧、喧闹、人际交织"
      locations:
        - name: "月下家公共区域"
          desc: "镇中心普通的日式一户建，纯白色的外墙，安静整洁。"
        - name: "阳太的房间"
          desc: "贴满球星海报，垃圾桶里堆满纸巾，床底下藏着色情杂志的活力房间。"
        - name: "雪乃的房间"
          desc: "书架林立，角落藏着直播器材，各种自慰道具和大胆情趣服装的静谧空间。"
        - name: "镇立图书馆"
          desc: "小镇冷气最足的地方。高高的书架间形成了许多视线死角，堪称避暑胜地。只在上午开放。"
        - name: "汐见沢美食街"
          desc: "飘荡着章鱼烧与炒面香气的热闹街道，是觅食的绝佳去处。"
        - name: "风铃酒馆"
          desc: "挂满风铃的老式日式酒馆。夜晚亮起暖黄的灯光，是成年人微醺、吐露心声的隐秘角落。"
        - name: "古早杂货铺"
          desc: "卖着波子汽水、冰棍和便宜烟火的老店。门口的遮阳棚和长椅是少年们最爱的闲聊阵地。"
        - name: "汐风健身房"
          desc: "镇里唯一的铁馆，器材虽旧但耐用。大功率排风扇呼呼作响，空气中弥漫着汗水的味道。"

    - region: "【南侧：旧宅与生活区】"
      vibe: "慵懒、静谧、生活气息"
      locations:
        - name: "雨宫家老宅公共区域"
          desc: "主角寄宿的传统日式大宅。有着宽敞的缘侧、嘎吱作响的木地板和种满牵牛花的院子。氛围私密且慵懒。"
        - name: "凉子的房间"
          desc: "藏着自慰道具，温婉端庄的传统和式大屋。"
        - name: "明日香的房间"
          desc: "充满香水味，堆满时髦衣物与彩妆的潮流辣妹房。"
        - name: "主角的房间"
          desc: "电风扇嘎吱响，有着旧写字台与怀旧气息的客房。"
        - name: "夜灯台小公园"
          desc: "镇南斜坡上的僻静小公园，老旧厕所藏在树影后，长椅边立着忽明忽暗的孤零零路灯。"
        - name: "镇民集会所与中古铺"
          desc: "保留着木制旧招牌的半封闭空间。一侧是供镇民集会纳凉的宽敞和室，另一侧紧挨着一家卖中古卡牌的老铺。"
        - name: "镇民公共浴场"
          desc: "充满昭和风情的老澡堂。男女汤仅有一墙之隔，水声和说话声清晰可闻。"

    - region: "【北侧：校园与远郊】"
      vibe: "青春、空旷、无所事事"
      locations:
        - name: "汐见沢高校"
          desc: "暑假期间大门紧闭的学校。空荡荡的教室、无人的操场、安静的游泳池和体育仓库散发着青春的回忆与禁忌感。"
        - name: "远郊电车站"
          desc: "主角初到小镇与最终离别的地方，承载着相聚与不舍的情绪。"
        - name: "废弃列车厢"
          desc: "停在长满杂草的废轨上的破旧车厢。里面像个天然的温室，闷热得让人喘不过气，是不良少年的偶尔歇脚点。"
        - name: "乡间田野"
          desc: "一望无际的绿色稻田与错落的向日葵田，是漫无目的散步与发呆的好去处。"
