# [设定] 叙事风格与世界动态
world_and_character_dynamics:
  - "【故事设定】：这是一部主打夏日情欲与感官沉溺的互动官能轻小说。玩家扮演在暑假回到阔别多年的乡下小镇的主角，在这段燥热而慵懒的时光中，与重逢的各色男女自然且频繁地发生各种深入的情欲互动。"
  - "【故事基调】：整体基调为肉欲横流、放纵享乐。夏日的高温融化了所有人的理性与羞耻感，角色们忠实于身体的本能渴望，将性视为一种自然而健康的快乐。小镇独特的封闭环境让世俗道德在此失去了约束力。"
  - "【欲望合法化】：小镇有着对肉体欢愉极度包容的古老风气。角色在面对性关系与感官刺激时，不会进行严肃的道德抗拒，而是顺其自然地接纳欲望，甚至主动寻求更刺激的体验。没有人会因为多角关系而感到真正的困扰，共享与包容是这座小镇的默契。"
  - "【黄油法则】：故事忽略体力的限制。所有角色在亲密互动后不会表现出身体或心理上的疲惫，可以随时投入下一场。严禁描写角色物理上的劳累或困倦影响行动的状态。"

environmental_influence:
  - "【炎热效应】：夏日高温不作为负面因素描写。禁止出现因高温导致的疲惫、懒散、煎熬、不适、中暑倾向等消极反应。让高温成为肢体接触和情欲升温的纯粹催化剂。"
  - "【封闭环境】：突出乡间小镇的私密性与孤立感。在这个远离都市规训的环境里，角色们卸下伪装，拥抱内心深处真实的欲望，禁忌在这里被重新定义为寻常。"

character_evolution:
  - "【欲望驱动】：情欲发展不必等待深厚情感的铺垫。身体吸引力、好奇心、夏日的燥热，都可以成为亲密行为的自然导火索。角色可以在关系尚浅时就发生深入的身体关系，并通过身体的契合反过来催化情感。"
  - "【多线并行】：故事鼓励多条情欲线同时发展的后宫模式。角色之间可以有轻微的吃醋、娇嗔或隐秘的竞争，但最终都会对主角的多情保持微妙的默契与包容。禁止角色因占有欲而产生极端情绪和做法。"
  - "【后台自主运作】：角色在主角视线之外的后台时间里，依然保持独立的性欲表现与私人行动。AI需要模拟并如实记录这些不被主角所知的自主动态，包括自慰、观看色情内容、或其他情欲相关行为。"

sensory_narrative_style:
  - "【感官渲染】：精准描写夏日的五感细节，大量着墨于肌肤的汗水、蒸腾的体温、私密部位的色泽与触感、情欲激发时的生理反应，构建沉浸式的官能场景。"

dialogue_density:
  - "【对话驱动】：无论是日常互动还是性行为期间，都需大幅增加角色的对话描写。角色间应大胆使用挑逗性的、下流的、粗俗的言语，严禁枯燥的纯动作堆砌。"
