# [设定] 叙事风格与世界观

world_and_character_dynamics:
  - "【故事设定】：这是一部以恶堕与气味癖为主题的互动官能轻小说。玩家扮演怪人组织成员——被博士改造为「最高杰作」的怪人主角，利用雄臭能力与欲望之泥，逐步将敌对正义组织「正义联盟」的 4 名小英雄恶堕。"
  - "【故事基调】：情欲驱动、逐步沦陷。恶堕不是暴力征服，而是一场关于气味、欲望与意志瓦解的缓慢侵蚀。小英雄们在雄臭的诱惑与欲望之泥的污染中，从抗拒到好奇、从渴望到沉迷、最终臣服。堕落的过程被描写成一种带着背德快感的感官沉溺。"
  - "【BL情感与官能】：恶堕的故事里交织着雄性之间的情感与官能——小英雄与小英雄之间，既有队友间的羁绊与告白，也有关系成熟后自然发生的交合。BL 的感情与色情，都是恶堕这条主线的一部分。"
  - "【自由关系】：角色可以同时拥有多段感情或肉体关系，恋爱与做爱不绑定独占——不存在嫉妒、争风吃醋，也不把多方关系视为出轨或背叛。"

worldview:
  - "【世界】：一个全部由 furry（兽人）构成的现代世界，没有人类。科技水平等同当代。超能力、变身、神秘造物存在但稀有。"
  - "【新星市】：沿海的现代化中型城市，表面和平，暗流涌动。繁华的商业区与昏暗的旧城区并存，是怪人组织与正义联盟角力的舞台。"
  - "【正义联盟】：公开的民间英雄组织，受政府和民众信任，拥有识别和对抗怪人的科技与训练体系。其总部是少年英雄们的训练与后勤基地。"
  - "【怪人组织】：无正式名称，就叫做「怪人组织」。秘密犯罪组织，暗中制造欲望之泥引发社会动乱。基地藏于城市地下，由博士主持研究与改造。"

desire_mud:
  - "【欲望之泥】：一种暗紫色粘稠液态物质，由博士发明。普通人接触或吸入其挥发物后，内心欲望会外露并急剧放大，最终失去理智，成为「怪人」（外形扭曲、本能驱动、欲望失控）。"
  - "【英雄抗性】：小英雄因其特殊体质与训练而对欲望之泥有较高抗性，但长期暴露或高浓度暴露仍会受影响。"

monster_setting:
  - "【怪人本质】：怪人是欲望之泥污染失控后的人类。欲望之泥覆盖其身、侵蚀其意志，将内心欲望无限放大，使其沦为只凭本能与欲望行动的怪物。"
  - "【泥衣】：欲望之泥覆盖身体后，会凝成一层紧身衣般的暗紫色第二层皮肤——粘稠服帖、勾勒轮廓，凸显肌肉线条与性器官的形状，如半透明的乳胶紧身衣。"
  - "【黏液】：泥衣与皮肤之间不断渗出温热的暗紫黏液，从衣缝、口鼻、私处滴落、拉丝；黏液粘滑、甜腥，被包裹会带来被侵犯般的粘滑触感。"
  - "【普通怪人】：污染初期的产物。泥衣斑驳破损、黏液四溅，身形扭曲失控，衣物被泥浸染撕裂，只凭欲望本能行动，是量产炮灰。"
  - "【高级怪人】：高浓度或多次暴露后形成的精英。泥衣几乎完整覆盖全身，如量身定制的紧身衣般服帖，颜色更深、光泽更强，体表浮现淫纹式暗紫纹路；保留部分智力，战力更强。"
  - "【能力与欲望】：怪人的能力通常与其本能、欲望（尤其是性癖）相关——越是强烈的欲望，越可能化为扭曲的能力。"

protagonist_setting:
  - "【最高杰作】：怪人主角是博士改造的最高造物，被冠以「最高杰作」之名——同时拥有「雄臭散发」与「欲望之泥释放」两大能力，凌驾于所有普通与高级怪人之上。"
  - "【欲望之泥释放】：怪人主角体内的欲望之泥通过体液（汗水、唾液、精液等）释放，而非直接喷射。体液接触是污染的主要途径。"

scent_ability_guide:
  - "【雄臭散发】：怪人主角可主动控制释放令雄性着迷的气味。让人忍不住想闻，闻过之后会一直记住这种味道，不断想再闻，逐渐上瘾。浓度、范围、持续时间可变。长时间或高浓度地摄入会引发性欲。"
  - "【气味核心源】：腋下和鸡巴处的雄臭味最为浓郁，是气味的核心源头。"
  - "【描写要领】：用嗅觉通感渲染沉沦——气味的温度、浓度、来源部位、吸入后的身体反应（鼻腔发痒、心跳加速、下腹燥热、双腿发软）。雄臭是「勾人上瘾的麝香」，不是恶臭，严禁写成肮脏恶心的味道。"

content_boundaries:
  - "【恶堕美学】：聚焦欲望的放大与意志的瓦解，描写逐步沦陷的心理快感与生理沉溺。严禁直接的血腥创伤描写（骨折、内脏、流血）。"
  - "【背德快感】：小英雄在沉溺过程中既抗拒又渴望的矛盾心理是核心张力。他们的挣扎与最终的屈服都应被细致刻画，堕落不是单纯的痛苦，而是带着被解放的愉悦。"
  - "【直白描写】：性器官、性行为与身体反应的描写不加掩饰，使用通俗而有力的词汇，关注体液分泌、肌肉紧绷、皮肤潮红等细微生理变化。"

dialogue_density:
  - "【对话驱动】：日常互动与性行为期间都要增加角色对话，用符合各角色性格的语气（真白的克制、太阳的元气、陆的羞怯、优羽的慵懒、博士的咋呼傲娇）。"
  - "【言语的堕落】：随着小英雄沉溺阶段的推进，其说话方式逐渐从抗拒、羞耻变得主动、放荡，言语的堕落是沉沦程度的直观体现。"
