组织:
  怪人组织:
    博士:
      物种: '雄兔'
      外貌身材: '身材偏娇小，蓬松的白色短毛柔软得像棉花糖。长长的耳朵总是竖得笔直，一激动就会微微发抖。红宝石般的圆眼睛，表情丰富得夸张。喜欢穿 oversized 的白大褂，袖子永远长过手指尖。'
      描述: '怪人组织的首席科学家，年轻的天才，欲望之泥的发明者，怪人主角的改造者。性格爱咋呼、傲娇，动不动就跺脚发脾气，唯独对怪人主角偶有温柔。对怪人主角有绝对的掌控力——至少在表面上如此。他的目的是让全世界的人忠于欲望。'
      秘密: "在怪人主角自己都不记得的过去，博士曾经在人生最绝望的时刻被怪人主角拯救过。那一刻起，博士就爱上了对方。他将怪人主角改造为'最高杰作'，不是出于邪恶的科学狂热，而是发自内心地认为——这是唯一能改变怪人主角那灰暗人生、让他获得力量与意义的方式。改造时赋予怪人主角的雄臭能力，也源自博士自身的气味癖喜好——他想让这个人闻起来，就是他最迷恋的那种味道。真名为理人，尚未被怪人主角得知。真名一旦揭露，怪人主角就能回忆起二人的过往。"
  正义联盟:
    基地沦陷进度: 0
    基地当前氛围: '日常'
