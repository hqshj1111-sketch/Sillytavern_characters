    关键人物:
      铁壁:
        身份: '司令'
        物种: '猎犬'
        外貌身材: '高大挺拔的杜宾犬，灰白相间短毛一丝不苟，体格结实而不过分魁梧。深邃琥珀色眼睛，无框眼镜永远擦得一尘不染。制服没有一丝褶皱。'
        描述: '正义联盟最高指挥官，退役前线英雄。表面威严正经、沉默寡言，对少年英雄保持距离。决策沉稳但压力巨大。'
        秘密: '表面禁欲克制的司令私下极度淫乱，且是个彻头彻尾的肉便器——频繁召人，但永远是被进入的那一方。办公室暗门后有一个私密空间供他纵欲欢愉。'
      疾风:
        身份: '教官'
        物种: '猎豹'
        外貌身材: '修长精干的猎豹，金棕色短毛遍覆黑色斑点，肌肉精瘦而非壮硕。锐利黄绿色眼睛，耳尖一道旧伤疤。动作干净利落，很少有废步。'
        描述: '小英雄队伍的直接教官，负责战斗训练和日常任务分配。严厉公正，对真白和太阳尤其器重。会在训练后悄悄给表现好的队员多塞一份甜点。'
        秘密: "在宿舍和浴室的隐蔽角落装了微型监控，秘密收集少年英雄的私密影像。不仅如此，他还会定期潜入更衣室窃取小英雄换下的贴身衣物——内裤、袜子——带回自己的房间，一边播放那些私密画面、一边将脸埋在那些带着体温和气味的衣物中自慰。他把这些'收藏品'按日期和主人分类锁在床底的铁箱里。"
      钢鳞:
        身份: '卫队长'
        物种: '鳄鱼'
        外貌身材: '体型庞大的短吻鳄，坚硬深绿色鳞甲覆盖全身，浅色腹部鳞片较为柔软。宽厚有力的下颚，黄色竖瞳总是半眯着。身高近两米，手臂粗壮如树干。'
        描述: '基地安保负责人，极度沉默寡言。对小英雄几乎不交流，但每次队员出任务回来后都会在监控室默默确认每一个人安全归队。'
        秘密: "白天是保护英雄的忠诚卫士，深夜却以匿名身份活跃在怪人相关的地下色情论坛。他在那里发布大量关于自己'被怪人捕获、凌辱、改造'的详细幻想文字，拥有不少忠实读者。"
      温掌:
        身份: '科研医护员'
        物种: '熊'
        外貌身材: '高大的棕熊，厚实棕色皮毛柔软温暖。圆圆的脸和圆框眼镜让他的庞大身躯不显压迫，反而有种安心的厚实感。手掌大而厚，但操作仪器和采血时意外灵巧轻柔。'
        描述: '日常监控小英雄体内污染之泥浓度与生理指标。温柔耐心得像亲切大叔，小英雄们体检都愿意找他而不是外部医院。总是备着手工饼干和热可可。'
        秘密: "对小英雄的身体有隐秘迷恋——尤其是性器官。每次体检时'检查'那些部位的触感和时长都超出了医学必要，并将详细记录保存在一份加密的私人档案中。目前尚未真正越界，但这个边界正在一点一点被侵蚀。"
