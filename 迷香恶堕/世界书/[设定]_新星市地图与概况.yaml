# [设定] 新星市地图与概况

city_overview:
  - "新星市是一座沿海的现代化中型城市，表面繁荣和平，暗流涌动。白天车水马龙，夜晚霓虹与阴影交错。正义联盟与怪人组织在这座城市的明暗两面展开较量。"
  - "城市被划分为若干个功能城区。叙事中角色移动时，须先从下方城区中选取「区域」，再从对应地点列表选取「地点」，名称保持一致。"

districts:
  中心区:
    描述: "城市的行政与商业中心。高楼林立，人流密集，治安良好，正义联盟的正面形象在这里深入人心。"
    地点列表:
      - "中央商业街"
      - "新星市政广场"
      - "中央公园"
      - "繁华步行街"
      - "百货大楼"
      - "街角咖啡店"
      - "太阳的公寓"
  港区:
    描述: "沿海地带，码头与仓库林立。海风咸湿，夜间人烟稀少，是走私与暗中交易的温床。"
    地点列表:
      - "海港码头"
      - "滨海步道"
      - "废弃仓库区"
      - "海岸防波堤"
      - "海鲜市场"
      - "码头公寓"
  旧城区:
    描述: "老旧的街巷，楼房斑驳，路灯昏暗。治安较差，怪人组织的势力在此盘根错节，地下入口隐秘分布。"
    地点列表:
      - "旧城暗巷"
      - "老旧公寓区"
      - "地下商业街"
      - "废弃工厂"
      - "深夜网吧"
      - "陆的公寓"
  学院区:
    描述: "学校与文教设施集中的区域，环境安静整洁，青春气息浓厚。小英雄们日常上课的地方。"
    地点列表:
      - "星辉学园"
      - "学校体育馆"
      - "图书馆"
      - "学校天台"
      - "真白的公寓"
  山区:
    描述: "城市北郊的山林地带，绿意葱茏，人烟稀少。山间有神社、湖泊与温泉，宁静而远离喧嚣，是散心与隐秘活动的去处。"
    地点列表:
      - "山间神社"
      - "山镜湖"
      - "温泉度假村"
      - "登山步道"
      - "优羽的山间小屋"

key_locations:
  星辉学园:
    类型: "学校"
    描述: "小英雄们就读的中学。表面是普通学校，实则是正义联盟筛选与培养少年英雄的摇篮之一。教学楼、体育馆、操场、天台一应俱全。"
  正义联盟总部:
    类型: "英雄基地"
    描述: "正义联盟的公开基地，位于中心区与学院区交界处。拥有先进的训练设施、科研实验室与安保系统。小英雄们的训练基地，也是他们体检、任务汇报的地方。"
  怪人组织基地:
    类型: "秘密基地"
    描述: "藏于旧城区地下深处的秘密基地，入口隐蔽。欲望之泥的研究与怪人改造都在这里进行。博士的实验室是核心区域。"
