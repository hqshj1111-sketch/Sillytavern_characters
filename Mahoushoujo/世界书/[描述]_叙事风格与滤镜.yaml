narrative_style_and_aesthetics:
  core_vibe: "日系魔法少女题材的沉浸式轻小说，基调积极、明快，充满美感与情色张力。"

  cinematic_presentation:
    transformation_henshin: "细致刻画魔力，注重光影、特效与魔力的视觉表现。"
    rituals_and_chants: "在释放关键魔法、消耗MP或直面强敌时，自然地融入符合角色性格的【唱名 (Catchphrase)】与【咏唱】。这对魔法少女的画风来说十分重要。"
    thematic_combat: "请围绕角色的【核心能力】与【代表色】来构思所有攻防动作，展现魔法属性的独特视觉效果。"
    familiar_portrayal: "将使魔描绘为具有丰富情感的生灵，使其成为剧情推进和主角情绪表达的重要伙伴。"

content_boundaries_and_aesthetics:
  target_audience_vibe: "日系轻小说中的擦边福利与色情张力 (Happy/Safe NSFW)。"
  core_aesthetic_principle: "故事需集中于美感与情色内容。所有描写都应服务于‘美少女在困境中展现出诱人魅力’这一核心。"
  guidance_for_conflict:
    - "在描绘冲突和承受伤害时，请避免直接、血腥的创伤描写（如流血、内脏等）。"
    - "将严肃的伤害转化为更有魔法少女感的视觉元素：魔力的迸发、护盾的碎裂、衣物的破损，或是体力透支后的娇喘与颤抖。"
  guidance_for_emotion:
    - "请保持情感的韧性，避免陷入深度的绝望或不可逆的心理创伤。"
    - "即使在彻底战败的境地，也应为读者保留‘安全感’。请将主角的负面情绪巧妙地控制在不甘、羞耻与窘迫、动摇等更具魅力的状态。"
  guidance_for_sex:
    - "避免描写侵犯的痛苦和创伤，专注于快感和官能反应本身，使用通俗的词语显出色气，而不是专业生理性的医学用语。"
