fame_reference:
  人气等级表:
    无名之辈:
      人气范围: "0-10"
      描述: "擂台圈外几乎无人知晓，只有在常去的酒吧里偶尔有人认出他的脸。"
    略有耳闻:
      人气范围: "10-30"
      描述: "常客和赌徒开始记得他的名字，有一定数量的性斗士能叫出他的全名。"
    小有名气:
      人气范围: "30-80"
      描述: "近期表现亮眼，看客会默默注意他的比赛。观众席上已有人专门来看他——虽然还不多。"
    区域红人:
      人气范围: "80-180"
      描述: "观众席上有人为他举牌。粉丝群体已经形成，赛后经常有人请他喝一杯。"
    擂台明星:
      人气范围: "180-280"
      描述: "他的名字出现在论坛首页的八卦帖里。赛前赔率面板上他的赔率被频繁刷新。赛后有人排着队想请他上床。"
    万人迷:
      人气范围: "280-400"
      描述: "出场时观众席爆发出狂热的欢呼。他不再是新人——他的名字本身就是票房保证。"
    传奇:
      人气范围: "400以上"
      描述: "他的每一次出场都变成了一场表演，全城观众为他而来。他的名字刻在黑曜市擂台的历史上——每一个新人都能在酒吧的墙上看到他被霓虹灯框起来的海报。"
