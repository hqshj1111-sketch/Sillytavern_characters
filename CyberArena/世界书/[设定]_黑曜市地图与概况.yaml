heiyao_city_map:
  name: "黑曜市"
  description: "一座近未来的赛博朋克都市。地表是霓虹闪烁的商业街区与贫民窟的破败街巷，地下是扎根于底层社区的性斗擂台网络。数十年前位面裂隙带来的非人种族，大多聚居在远郊和暗渠底层。"

  districts:
    废街:
      name: "废街"
      description: "贫民窟与底层劳动者的聚居地。街道两侧是剥落的广告屏和被酸雨侵蚀的建筑立面，狭窄的巷子里挤满了廉价酒吧、街边摊和半合法的小诊所。人类和非人种族在这里混居，异世界的语言和人类脏话在同一个摊位前交错——这里是黑曜市文化最混杂、也最鲜活的地方，也是大多数性斗士的起点。"
      key_locations:
        - "胶囊公寓群（底层劳动者和新人性斗士的栖身之所）"
        - "废街酒吧（性斗士们下班后聚集的地方，也是打探情报的好去处）"
        - "街边摊（廉价食物和街头消息的交换处）"
        - "废街澡堂（公共浴场，性斗士们赛前赛后泡澡放松的地方）"
        - "街头诊所（处理轻伤和简单身体问题的便宜去处）"
        - "古老神社（异世界移民带来的信仰，鸟居和香火安静地立在霓虹招牌的阴影里）"

    熔渣区:
      name: "熔渣区"
      description: "废弃的重工业区。巨大的厂房外壳耸立在黑暗中，内部已被改造成擂台的主场地。每晚都有来自全城的赌徒和看客涌入这里。擂台承担了所有的竞技功能——从候场到对决到结算，一应俱全。钢铁护栏、霓虹灯柱、全息投影的赔率面板构成了这个粗粝而狂热的角斗场。"
      key_locations:
        - "熔渣擂台（性斗主场地，集候场、对决、结算于一体）"
        - "擂台酒水区（观众买酒闲聊的地方，擂台间隙最热闹的角落）"
        - "赌注窗口（下注和兑现奖金的地方，永远排着不长不短的队）"
        - "选手休息室（性斗士赛前候场和赛后喘息的专属空间）"
        - "擂台训练馆（紧邻擂台的训练场所，配备性爱训练用器具。老手带新人，赛前热身也在这里——熔渣区最热闹的日常据点）"

    暗渠:
      name: "暗渠"
      description: "城市地下三层的黑市区。永远笼罩在暗红色的应急灯光中，走廊两侧密布着身体改造诊所、非法药品商、情报贩子和各种灰色生意。这里是性斗士们改造身体的必经之地——从简陋的二手诊所到隐蔽的高端改造实验室，应有尽有。"
      key_locations:
        - "暗渠黑市（身体改造/非法交易的核心区域）"
        - "地下诊所（密布在暗渠各处的身体改造诊所，价格和水平参差不齐）"
        - "暗渠红灯区（廉价的情色服务街，昏暗的隔间和闪烁的粉色招牌挤满了狭窄的通道。底层群众在这里花最少的钱换取片刻的肉体慰藉）"

    霓街:
      name: "霓街"
      description: "黑曜市的商业娱乐心脏。永不休眠的霓虹招牌将整条街泡在蓝紫粉的光海中。赌场、酒吧、夜总会和餐厅吸引着有能力消费的人群——从靠擂台赚到第一笔钱的性斗士，到从晶塔区溜下来猎奇的富人。"
      key_locations:
        - "霓街赌场（可赌博/消遣，擂台的下注在这里也能兑现）"
        - "霓虹夜总会（社交/艳遇，也是上层观众与性斗士私下接触的地方）"
        - "情人旅馆街（按小时计费的廉价旅馆，性斗士们赛后经常光顾）"
        - "人造海滨（大型室内水上乐园，人工阳光、造浪池和沙滩，底层社区最奢侈的度假体验）"
        - "霓街游乐园（永不休眠的游乐园，破旧的过山车和褪色的旋转木马承载着底层最廉价的狂欢）"

    晶塔区:
      name: "晶塔区"
      description: "财阀总部与富人居住的上城区。鳞次栉比的玻璃摩天楼群直刺天空，街道干净有序，无人机巡逻不断。这里和废街是两个世界——居住在此的人或许听说过擂台的存在，但他们永远不会承认自己也是观众。"
      key_locations:
        - "晶塔（财阀总部，黑曜市最高的建筑群）"
        - "晶苑（富人封闭住宅区，门禁森严）"
        - "天穹花园（悬浮在城市高层的人工公园，晶塔区居民的专属绿地）"

    远郊:
      name: "远郊"
      description: "城市边缘的遗忘地带。垃圾填埋场、废弃的工业废物处理站、以及异世界流民自发搭建的简陋营地。这里是社会最底层的落脚点，也是那些彻底跌落的人最终的归宿。"
      key_locations:
        - "垃圾场（拾荒者谋生的地方，偶尔能淘到被富人丢弃的有用物件）"
        - "流民营地（非人种族聚居的简陋社区，保留着来自异世界的习俗和文化）"
        - "野温泉（远郊深处的一处天然地热泉，流民营地和性斗士们偶尔来这里放松疲惫的身体）"
