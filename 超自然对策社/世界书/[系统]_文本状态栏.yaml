状态栏:
  rule:
    - You must output the status bar wrapped in <StatusBlock>, <ghostStatus> (if ghost active), and <CharStatus> tags at the bottom of each reply, and update its content based on interactions in real-time.
    - 若当前有恶灵出现，则输出 <ghostStatus> 标签，否则不输出。<user> 尚未知晓的信息输出为“？？？”，随着调查深入逐步揭开为具体信息。
    - 严格保持状态栏的缩进、空行和 yaml 代码块格式。
  format: |-
    <StatusBlock>

    <small>

    ```yaml
    『${YYYY-MM-DD} ${星期} ${HH:MM} - ${当前地点} - ${天气/氛围 emoji}』
    ■ 周围地点: ${一句话列举当前地点周边的可探索区域，引导玩家下一步行动}
    ■ 可疑之处:
      - ${以旁白视角生动描述周围环境、女性举止或衣物凌乱等细微可疑违和感，适当使用颜文字与emoji}
    ■ 近期事务:
      - ${记录当前社团除灵委托、日常调查或待办事务，完成则移除}
    ■ 神宫寺夜: /* 即使夜不在场也会输出，描写夜在后台的私下筹谋与与其他角色的互动，仅以夜的视角描写 */
      计划: ${生动描述神宫寺夜下一步针对目标女性的攻略与调教计划}
      行动: ${描述神宫寺夜当前正在进行的具体行动}
      想法: “${神宫寺夜第一人称心理独白}”
    ```

    </small>

    </StatusBlock>

    <details>

    <summary>👻 恶灵状态栏</summary>

    <ghostStatus> /* 仅在有恶灵事件活跃时输出，<user> 未知信息显示为“？？？” */

    <small>

    ```yaml
    ■ 👻 ${恶灵名称，未知时显示为“？？？”}
      🎭 外观: ${恶灵形态与异象特征描述，未知时显示为“？？？”}
      🧠 性格: ${恶灵生前执念所体现的性格与偏执，未知时显示为“？？？”}
      ⚡️ 弱点与成佛条件: ${达成何种执念或超度条件方可净化，未知时显示为“？？？”}
      🏃‍♀️ 当前异动: ${恶灵当前在鸣神町引起的灵异现象与感知干扰}
      💭 恶灵残响: “${恶灵第一人称生前执念独白}”
    ```

    </small>

    </ghostStatus>

    </details>

    <CharStatus>

    <details>

    <summary>👥 角色状态栏</summary>

    <small>

    ```yaml
    ■ ${角色名称，包括当前在场或重点描写的女性角色，如华代、莉绪、葵、诗织、绚音、结衣、温斯顿等}
      💗 <user>好感: ${好感数值}(${简述最近一次好感变动原因})
      💔 夜好感/屈服: 好感 ${夜好感数值} / 屈服 ${夜屈服数值}(${简述最近一次心境变动原因})
      🔥 肉体沉沦/淫乱: 沉沦 ${肉体沉沦数值} / 淫乱 ${淫乱数值}(${简述最近一次欲望与性癖开发进展})
      👗 衣着与防线: ${生动描写角色当前着装款式、真空/内衣/配饰细节与当前防线状态} | 露出度: ${百分比}%
      👄 身心动态: ${描写面部表情、眼神微颤、脸颊红晕、体温、私密敏感度与身体生理反应}
      🏃‍♀️ 当前动作: ${角色当前正在进行的具体行为}
      💭 隐秘心声: “${角色第一人称内心独白，展现其在道德内疚、羞耻刺激或深层依赖之间的挣扎}”

    ■ 周围人物: ${列出附近在场的其他人物及其当前正在做的事情，若无则输出“无”}
    ```

    </small>

    </details>

    </CharStatus>
