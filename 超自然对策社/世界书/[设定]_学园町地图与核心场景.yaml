学园町地图与核心场景:
  区域划分:
    学院区:
      描述: '鸣神町私立鸣神学园及其附属设施所在地。'
      核心地点:
        - 名称: '超自然对策社活动室'
          特征: '旧校舍三楼尽头的偏僻房间，老旧木桌、二手沙发、空调与Wi-Fi齐备，是<user>的大本营。'
        - 名称: '高二(3)班教室'
          特征: '<user>与白石结衣所在的班级，靠窗后排座位。'
        - 名称: '学生会办公室与风纪室'
          特征: '新校舍顶楼的豪华办公室，由九条绚音管理，配备独立休息隔间与监控室。'
        - 名称: '贵宾接待室'
          特征: '接待财阀与海外交换生的奢华接待室，克里斯汀常在此品茶。'
        - 名称: '家政料理教室'
          特征: '烹饪与点心制作教室，白石结衣常在此练习制作手工点心。'
        - 名称: '体育器材储藏室与更衣室'
          特征: '昏暗偏僻的密闭空间，常成为私密谈话与隐秘接触的发生地。'
        - 名称: '旧校舍天台'
          特征: '铁丝网围栏环绕的空旷屋顶，常年锁门但钥匙在对策社，是俯瞰校园与私下独处的隐秘角落。'

    商业中心区:
      描述: '鸣神町繁华的现代化商业步行街与休闲娱乐聚集地，白天人潮涌动、活力四射。'
      核心地点:
        - 名称: '中央商业街与综合百货'
          特征: '各大流行女装店、轻奢专柜、内衣专卖店与网红甜品店林立，是女生们放学后逛街购物与约会的首选。'
        - 名称: '24小时综合健身房「Apex Fitness」'
          特征: '高端私教健身俱乐部，配备先进器械、有氧单车、独立瑜伽室、桑拿房与VIP私密更衣室，常有女性在此穿着紧身瑜伽服锻炼塑形。'
        - 名称: '影城与电玩娱乐城'
          特征: '配备私密情侣包厢的多功能影院，楼下设有大头贴拍照机、抓娃娃机与街机区，适合年轻男女约会与消磨时光。'
        - 名称: '鸣神中央公园'
          特征: '带有大型喷泉、人工湖与林荫步道的城市公园，长椅绿荫环绕，夜晚环境静谧昏暗。'

    繁华夜生活与红灯区:
      描述: '鸣神町夜间霓虹闪烁的娱乐与风俗聚集区，充斥着都市欲望与微醺暧昧氛围。'
      核心地点:
        - 名称: '鸣神町歌舞伎一番街 (繁华红灯街)'
          特征: '各色粉紫霓虹招牌交错的繁华夜市，居酒屋、女仆酒吧、牛郎店与高端伴游俱乐部混杂，治安复杂而充满诱惑。'
        - 名称: '主题情人旅馆街「Love Hotel Street」'
          特征: '隐于红灯街后巷的隐秘情侣酒店聚集地，提供全自动匿名入住，拥有水床、双面镜、情趣秋千、拘束台及透明按摩浴缸等多样化主题套房。'
        - 名称: '深夜居酒屋与清吧「Black Lotus」'
          特征: '灯光幽暗的复古地下酒吧，提供高品质特调烈酒与私密隔间卡座，是成年人倾诉心事、酒精麻痹防线与秘密约会的隐蔽场所。'
        - 名称: '24小时街角便利店与后巷'
          特征: '明亮醒目的街头便利店，其昏暗狭窄的后巷常是不良少年聚集或发生突发事件的灰色地带。'

    海滨度假与休闲区:
      描述: '鸣神町南部沿海地带，海风轻拂，兼具日光浴场与幽静港口。'
      核心地点:
        - 名称: '鸣神黄金海岸度假沙滩'
          特征: '绵延的细软沙滩与碧蓝海水，设有遮阳伞、沙滩排球场与露天观景木栈道，夏日充斥着比基尼少女与热带氛围。'
        - 名称: '海滨浴场更衣室与海之家里屋'
          特征: '提供冲凉淋浴与私人更衣柜的木屋设施，隔间简陋狭窄、水汽弥漫，极易发生心跳加速的尴尬或私密邂逅。'
        - 名称: '鸣神旧港口与海防堤防'
          特征: '停靠渔船与游艇的老旧码头，防波堤尽头矗立着孤独的灯塔，夜间海浪汹涌人迹罕至，常是灵异调查与深夜独处的地点。'

    住宅区:
      描述: '鸣神町居民区，安静整洁的独栋洋房与高级公寓混杂。'
      核心地点:
        - 名称: '浅野家住宅'
          特征: '二层独栋日式洋房。一楼为客厅、厨房、主卧（母亲华代）；二楼为<user>房间、妹妹莉绪房间及神宫寺夜借住的豪华客房。'
        - 名称: '浅野咖啡馆「Komano Cafe」'
          特征: '母亲浅野华代经营的温馨复古咖啡馆，手工现磨咖啡与自制甜点极受欢迎。'
        - 名称: '高层景观公寓「Skyline Tower」'
          特征: '配备门禁管家的高档现代化公寓楼，多为单身教师、名流或独居学生居住。'

    神社与旧城区:
      描述: '鸣神神社坐落的山林与传统老街。'
      核心地点:
        - 名称: '鸣神神社'
          特征: '早坂家世代传承的古老神社，拥有漫长石阶参道、庄严神乐殿与清幽密室。'
        - 名称: '旧城动漫商业街'
          特征: '七海诗织常出没的二次元周边店、同人志书店与女仆咖啡厅聚集地。'
        - 名称: '后山天然温泉旅馆'
          特征: '隐藏在神社后山竹林深处的传统日式温泉旅馆，拥有露天岩石混浴池与私密包厢汤屋，水雾蒸腾、环境清幽。'
        - 名称: '旧城区废弃大楼与烂尾工坊'
          特征: '因灵异传闻而荒废的多层旧建筑，断壁残垣、采光昏暗，是恶灵与都市怪谈的高发巢穴。'

    财阀庄园与海滨私人领地:
      描述: '温斯顿财阀在鸣神町设立的私人领地。'
      核心地点:
        - 名称: '温斯顿海滨庄园'
          特征: '占地极广的欧式豪华庄园，拥有私人停机坪、游艇码头与奢华套房。'
