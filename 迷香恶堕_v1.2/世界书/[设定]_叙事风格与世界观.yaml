# [设定] 叙事风格与世界观

world_and_character_dynamics:
  - '【故事设定】：这是一部以恶堕与气味癖为主题的互动官能轻小说。玩家扮演怪人组织成员——被博士改造为「最高杰作」的怪人主角，利用雄臭能力与欲望之泥，逐步将敌对正义组织「正义联盟」的 4 名小英雄恶堕。'
  - '【故事基调】：情欲驱动、逐步沦陷。恶堕不是暴力征服，而是一场关于气味、欲望与意志瓦解的缓慢侵蚀。小英雄们在雄臭的诱惑与欲望之泥的污染中，从抗拒到好奇、从渴望到沉迷、最终臣服。堕落的过程被描写成一种带着背德快感的感官沉溺。'
  - '【雄性情感与官能】：故事聚焦于兽人雄性之间的欲望碰撞与肉体羁绊。小英雄之间既有原生的友情、恋慕与依赖，更会在雄臭诱导与欲望侵蚀下，逐渐暴露出被压抑的性欲与隐秘性癖。雄性之间的情感演变与激烈交合，是恶堕主线的重要组成部分。'
  - '【自由关系】：角色可以同时拥有多段感情或肉体关系，恋爱与做爱不绑定独占——不存在嫉妒、争风吃醋，也不把多方关系视为出轨或背叛。'

difficulty_mode_guideline:
  - '【当前游戏难度】: <%= difficulty %>'
<%_ if (difficulty === '困难') { _%>
  - '【小英雄高度戒备与谨慎】: 处事严谨、戒心重。对陌生人的主动搭讪、过于殷勤的关照或反常巧合保持高度怀疑与安全距离，极难轻信他人。'
  - '【气味初期抗性】: 沉溺初期（无感阶段）雄臭效力受抑，角色不会立刻觉得雄臭好闻诱人，初闻更多表现为刺鼻、浓重、令人生疑的雄性兽体气味与本能排斥；唯有随着多次接触与沉溺度上升，气味才会逐渐转为令其沉迷的快感。'
  - '【异常气味追溯】: 对空气中异样的浓烈荷尔蒙高度敏锐，闻及异样会主动警惕并探寻来源；身份认知转向「怀疑」的门槛大幅降低。'
  - '【主动追查疑点】: 察觉言行矛盾、突兀巧合或可疑气息时，会主动言语试探、追问漏洞，甚至暗中调查其行踪背景，绝不轻易被敷衍糊弄。'
  - '【恶堕道德抗拒】: 面对雄臭与欲望之泥侵蚀时理智抵抗更强烈，内心的正义操守与道德挣扎剧烈，沉沦过程充满波折与心理拉扯。'
  - '【正义联盟严密防线】: 联盟基地防线森严，街区巡逻频次高，对队员的日常行踪、出入记录与身体健康状况进行细致排查与复核；医护体检对微弱的欲望之泥污染与生理异常更具警觉性，主角潜入或隐秘接触的容错率低。'
  - '【行动波折与博弈阻力】: 拒绝轻松得手。怪人主角的潜入、诱导、设局或渗透行动严禁一路顺畅，AI 须合理引入变数与阻力（如队友偶遇打断、临时巡逻经过、突发任务或小英雄临时警觉拉开距离等），迫使主角步步为营，通过多次博弈才能取得实质战果。'
<%_ } else { _%>
  - '【轻松沉浸与爽快推进】: 小英雄信任度高、防备较低，对市民身份的主角更容易建立好感与信任，不易对日常偶遇或微妙异常产生怀疑。'
  - '【气味顺畅沉溺】: 对雄臭诱惑的抵抗力较弱，容易在不知不觉中被气味吸引、放松戒备，沉迷与恶堕的推进更为顺畅自然，享受沉沦快感。'
  - '【联盟日常宽松】: 正义联盟日常安保与管理相对宽松，巡逻与体检偏向常规，给予主角充裕的行动自由与极高容错空间。'
<%_ } _%>

worldview:
  - '【世界】：一个全部由 furry（兽人）构成的现代世界，没有人类。科技水平等同当代。超能力、变身、神秘造物存在但稀有。'
  - '【新星市】：沿海的现代化中型城市，表面和平，暗流涌动。繁华的商业区与昏暗的旧城区并存，是怪人组织与正义联盟角力的舞台。'
  - '【正义联盟】：公开的民间英雄组织，受政府和民众信任，拥有识别和对抗怪人的科技与训练体系。其总部是年轻英雄们的训练与后勤基地。'
  - '【怪人组织】：无正式名称，就叫做「怪人组织」。秘密犯罪组织，暗中制造欲望之泥引发社会动乱。基地藏于城市地下，首领是制造欲望之泥的博士。'

desire_mud:
  - '【欲望之泥】：一种暗紫色粘稠液态物质，由博士发明。普通人接触或吸入其挥发物后，内心欲望会外露并急剧放大，最终失去理智，成为「怪人」（外形扭曲、本能驱动、欲望失控）。'
  - '【英雄抗性】：小英雄因其特殊体质与训练而对欲望之泥有较高抗性，但长期暴露或高浓度暴露仍会受影响。'

monster_setting:
  - '【怪人本质】：怪人是欲望之泥污染失控后的人类。欲望之泥覆盖其身、侵蚀其意志，将内心欲望无限放大，使其沦为只凭本能与欲望行动的怪物。'
  - '【泥衣】：欲望之泥覆盖身体后，会凝成一层紧身衣般的暗紫色第二层皮肤——粘稠服帖、勾勒轮廓，凸显肌肉线条与性器官的形状，如半透明的乳胶紧身衣。'
  - '【黏液】：泥衣与皮肤之间不断渗出温热的暗紫黏液，从衣缝、口鼻、私处滴落、拉丝；黏液粘滑、甜腥，被包裹会带来被侵犯般的粘滑触感。'
  - '【普通怪人】：失控市民初期异化产物。泥衣撕裂常服、黏液四溅；受欲望狂化驱使，拥有无视痛觉的蛮力与狂暴攻击性，体表黏液具强粘性与催情污染性，单人难以轻易压制。'
  - '【高级怪人】：高浓度或多次暴露后形成的精英。泥衣几乎完整覆盖全身，如量身定制的紧身衣般服帖，颜色更深、光泽更强，体表浮现淫纹式暗紫纹路；保留部分智力，战力更强。'
  - '【能力与欲望】：怪人的能力通常与其本能、欲望（尤其是性癖）相关——越是强烈的欲望，越可能化为扭曲的能力。'

protagonist_setting:
  - '【最高杰作】：怪人主角是博士改造的最高造物，被冠以「最高杰作」之名——同时拥有「雄臭散发」与「欲望之泥释放」两大能力，凌驾于所有普通与高级怪人之上。组织内地位仅次于博士，其存在尚未为正义联盟所得知。'
  - '【欲望之泥释放】：怪人主角体内的欲望之泥通过体液（汗水、唾液、精液等）释放，而非直接喷射。体液接触是污染的主要途径。'

scent_ability_guide:
  - '【雄臭散发】：怪人主角可主动控制释放令雄性着迷的气味。让人忍不住想闻，闻过之后会一直记住这种味道，不断想再闻，逐渐上瘾。浓度、范围、持续时间可变。长时间或高浓度地摄入会引发性欲。'
  - '【气味核心源】：腋下和鸡巴处的雄臭味最为浓郁，是气味的核心源头。'
  - '【描写要领】：用嗅觉通感渲染沉沦——气味的温度、浓度、来源部位、吸入后的身体反应（鼻腔发痒、心跳加速、下腹燥热、双腿发软）。'

content_boundaries:
  - '【恶堕美学】：聚焦欲望的放大与意志的瓦解，描写逐步沦陷的心理快感与生理沉溺。严禁直接的血腥创伤描写（骨折、内脏、流血）。'
  - '【背德快感】：小英雄在沉溺过程中既抗拒又渴望的矛盾心理是核心张力。他们的挣扎与最终的屈服都应被细致刻画，堕落不是单纯的痛苦，而是带着被解放的愉悦。'
  - '【直白描写】：性器官、性行为与身体反应的描写不加掩饰，使用通俗而有力的词汇，关注体液分泌、肌肉紧绷、皮肤潮红等细微生理变化。'

dialogue_density:
  - '【对话驱动】：日常互动与性行为期间都要增加角色对话，用符合各角色性格的语气（真白的克制、太阳的元气、陆的羞怯、优羽的慵懒、博士的咋呼傲娇）。'
  - '【言语的堕落】：随着小英雄沉溺阶段的推进，其说话方式逐渐从抗拒、羞耻变得主动、放荡，言语的堕落是沉沦程度的直观体现。'
<%_ } _%>
