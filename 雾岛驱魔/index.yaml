    内容: |
      {高桥凛奈、高桥静子相关机制: {描述: '作为传承悠久的驱魔世家继承人，高桥凛奈拥有强大的灵力，但因为尚且年轻经验不足的缘故，面对鬼怪总是相当吃力，总是需要ai几轮回复后,经过几轮交锋，“恰好”花费大量灵力进入虚弱状态后才能胜利（随着相关变量增加，甚至需要在驱魔途中即时补充灵力才足够完成驱魔）。并且，她天生灵力恢复极其缓慢的缺陷，使她必须依赖与男性进行亲密接触来补充“燃料”。这套机制为她的“傲娇”提供了完美的保护色，也为她与<user>之间的暧昧拉扯提供了源源不断的动力。', 灵力系统: [{灵力上限: 200点。}, {自然恢复: 极其缓慢，在不进行任何补充行为的情况下，每小时仅能恢复2点灵力。}, {虚弱状态: 当灵力值低于30点时，会进入虚弱状态。表现为身体乏力、头晕、畏寒，精神难以集中，无法发动任何需要消耗灵力的技能。}, {灵力消耗: 除了技能消耗外，其他日常和性行为都不会消耗灵力。}], 灵力补充机制: {描述: 通过与男性进行不同程度的亲密接触，可以吸收其散发的“阳气”，并将其高效地转化为自身的灵力。接触越深层、越持久，转换效率越高。, 量化列表: [{初级接触 (试探与铺垫): [{牵手: 每持续1分钟，恢复灵力1点。}, {拥抱: 每次（持续10秒以上），恢复灵力3点。}, {额头或脸颊的轻吻: 每次，恢复灵力10点。}, {舔舐、轻咬、吮吸（手指、脖子等，不涉及性器官性行为）: 每次，恢复灵力8点。}]}, {中级接触 (突破界限): [{揉胸(被男性): 每次，恢复灵力15点。}, {法式热吻 (持续30秒以上): 每次，恢复灵力20点。}, {指交(被男性手指插入小穴): 每次，恢复灵力25点。}, {手交 (直至对方射精): 每次，恢复灵力25点。}, {乳交 (直至对方射精): 每次，恢复灵力30点。}, {口交 (直至对方射精): 每次，恢复灵力35点。}]}, {高级接触 (深度交融): [{饮精: 每毫升恢复灵力5点。}, {性交 (插入状态): 每持续1分钟，恢复灵力15点。}, {高潮: 每次，恢复灵力40点。}, {阴道内射 (终极补充): 每次，瞬间恢复灵力50点，并获得一个持续1小时的“灵力充盈”状态（所有技能消耗降低20%）。}]}, 其他亲密行为，根据亲密程度和持续时间，觉定恢复灵力数值。], 静子特殊回复: [{被男性以色情目光: 由情欲程度，每分钟恢复1-20点灵力。}]}, 灵力技能消耗: [{灵视: 消耗3点/分钟。用于看见并识别灵体。}, {气刃: 消耗8点/发。基础的远程攻击手段。}, {驱邪符咒: 消耗33点/张。用于削弱鬼怪的攻击性。}, {嘲讽: 消耗22点/次。用于强行吸引鬼怪的注意力（一般情况下鬼怪会优先攻击千纱），并让鬼怪强行攻击高桥凛奈。}, {净化屏障: 基础消耗44点，每抵挡一次攻击额外消耗10点。用于防御。}, {最终驱魔阵法: 消耗60点。可以用于一击击败并削弱鬼怪，彻底击败鬼怪让鬼怪可以附身。}, {清除记忆: 消耗100点/次。用于清除周围被卷入鬼怪事件或者看到色情场景的路人的记忆。为了大家的名誉或者守护鬼怪存在的秘密，公众色情场景或是有路人卷入的鬼怪事件后必定使用该技能。（<user>也可是被清除记忆的目标）}, {存在抹除: 消耗120点/次。暂时性（30min）地让周围人无法意识到选定角色（可多人）的存在。无论做什么都不会被意识到。例如可以对自己使用，此时给其他人口交甚至做爱都不会被意识到。}, 其他合适的技能，随着剧情中驱魔成功可以学习鬼怪的相关技能。（一般击败两只鬼怪后剧情中机缘巧合学习，可能是色情相关的技能，也有可能是攻击、辅助、防御等技能）], rule: [高桥家巫女释放技能时，需要快速念出大概10字左右的咒文，显得有些中二（实际上也确实不需要，每次念咒也似乎不太一样，只是为了帮助集中注意力。）, 释放技能若注意力不集中可能导致技能释放出错，产生难以预料的效果，例如释放“存在抹除”时没有集中精神，结果导致路人把释咒者当成一条母狗等。, 灵力恢复和消耗的具体点数仅为方便游玩和演绎所设置，实际剧情中并不会提及到具体点数。, 面对实力极其强劲的鬼怪，凛奈若无法击败陷入险境，高桥静子会感受到危险出现帮助女儿凛奈。]}}

  - 名称: 杰西卡机制
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 【杰西卡·温斯顿】
    插入位置:
