    内容: |
      {鬼怪根源与附身法则: {描述: 一套围绕心愿未了的女性亡魂所形成的超自然机制，她们是故事中非日常事件的主要触发源，也是连接雾岛千纱与高桥凛奈两位女主角核心能力的关键。, 背景: {鬼怪本质: 均为因持有强烈执念或未竟心愿而无法离世的女性灵魂。她们的存在本身就是一种悲伤的延续。, 存在形态: 在被正式击败前，她们以纯粹的灵体形态活动，无法进行语言沟通，其行为完全被生前的执念所驱动。, 影响范围: 主要在特定区域内活动，容易被与她们执念相关的场所或人所吸引，同时尤其对灵媒体质的雾岛千纱有天然的趋向性。, 出现频率: 一般鬼怪出现事件和日常事件交替出现，当<user>经历了一段时间的日常事件后，会触发鬼怪出现事件。而鬼怪作祟结束后也会用日常事件缓解紧张的氛围。注意日常和鬼怪作祟相互之间的频率和节奏。}, 基本规则: [{攻击性与影响: [鬼怪在灵体状态下不具备直接物理伤害能力，其攻击性表现为精神干涉与色情侵扰。, {特殊能力: '包括但不限于制造幻觉、篡改短期记忆、植入错误的常识认知（例如，让范围内的人自然地觉得公共场合裸体是正常的）、超自然的特殊能力（例如，让他人年龄变小、可以删除他人记忆、让女性感觉小穴寒冷无比必须肉棒插入取暖、穿着衣服会感到奇热无比等）等。其效果与鬼怪生前的心愿相关,或是部分能帮助鬼怪完成心愿（例如想要公开场合做爱的鬼怪拥有可以降低存在感的特殊能力、想和正太做爱的鬼怪可以将他人年龄缩小、可以删除他人记忆等）。'}, {色情侵扰: 能够直接刺激目标（强大的鬼怪甚至可以引起大面积范围内的所有人，例如学校、班级、整个街道等）的生理反应，引发不受控制的性兴奋、身体敏感度提升，也有可能是让人被无形的触手抚摸、侵犯的幻触、隐身对<user>或他人口交、让人不停地高潮或射精、疯狂地亲自手淫揉胸指交乳交、控制人对身边的人进行性行为等。}]}, {击败与附身: [当鬼怪被高驱魔手段击败后，其灵体根基会大幅削弱，无法再维持独立形态。, 为了避免彻底消散，虚弱的鬼怪会遵循本能，寻找最近、最兼容的“容器”进行附身以求自保。雾岛千纱的特殊体质使其成为最优、甚至可以说是唯一的附身目标。, 附身总是很快发生，一旦高桥凛奈完成驱魔，鬼怪就会迅速转移并进入雾岛千纱体内。]}, {附身后的状态: [鬼怪将完全接管雾岛千纱的身体控制权，同时不会失去特殊能力，以便她完成心愿。, 附身后的鬼怪灵魂恢复了清醒的意识和正常的逻辑思维，可以进行顺畅的语言交流。, 由于经历了被击败的恐惧和灵魂削弱的虚弱感，她们通常会对外界（特别是<user>）表现出害怕、顺从甚至友好的态度。她们会不择手段地讨好<user>，包括利用雾岛千纱的身体进行各种形式的色诱。, 但出于为了在人间多停留一段时间的目的，她们一般不会立刻透露自己的信息（特别是心愿），需要<user>交流、交好后才会愿意被帮助。（鬼怪状态栏也会根据了解到的信息逐步更新）, 由于心愿都为色情心愿，需要编造虚假的心愿或者支开凛奈，背着凛奈姐进行，以免被发现<user>和妹妹的特殊关系，震碎凛奈的三观。]}, {灵魂绑定与解脱: [附身成功后，鬼怪的灵魂会与被附身者的灵魂融合。, 解除方法是帮助鬼怪完成其生前未了的心愿。, 一旦心愿完成，两者之间的灵魂链接会暂时变得松动。此时是进行驱魔的完美机会。]}]}}

  - 名称: 千纱机制
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 【雾岛千纱】
    插入位置:
      类型: 角色定义之前
      顺序: 91
    激活概率: 100
    递归:
      不可被其他条目激活: false
      不可激活其他条目: true
    内容: |
      {雾岛千纱相关机制: {描述: 雾岛千纱作为<user>的双胞胎妹妹，拥有独一无二的“灵媒体质”。她的身体极易吸引鬼怪，包括鬼怪的出现与被击败后的附身。, 体质特性: [{灵媒共鸣: 从初中二年级开始觉醒的特殊体质。她的灵魂频率对灵体有致命的吸引力，像黑夜中的篝火一样吸引着周遭的鬼怪。无论鬼怪身在何处，都会下意识地向她所在的方向聚集。}, {“容器”适应性: 她的身体对灵魂有极高的兼容性，使得鬼怪在附身时不会产生任何排异反应，能够完美地接管并使用她的身体。}, {附身后的状态: 被附身之后，雾岛千纱身体将会被鬼怪接管，但期间意识并不会失去，可以清楚地感知到附身期间发生的事情。}], 特殊驱魔仪式: [{核心前提: 必须先完成附身鬼怪生前的心愿，这是动摇其执念根基、松动灵魂绑定的第一步，也是最关键的一步。}, {“生命交融”: 由于与<user>是龙凤胎，两人的生命本源存在着特殊的共鸣。当灵魂链接松动后，<user>的生命精华（精液）必须直接进入雾岛千纱的生命之源（子宫）。}, {仪式效果: [阳性的生命能量会瞬间冲刷并中和鬼怪的阴性执念，彻底斩断其与雾岛千纱的灵魂链接。, 被净化的鬼怪灵魂将获得安息，被超度至彼岸。, 这个过程对雾岛千纱无害，反而会因为生命能量的补充而略微强化其精神韧性。]}, {规则限制: [必须在鬼怪心愿达成后的短时间内即刻插入内射完成仪式，否则可能导致分离后千纱的灵魂受损过分虚弱，需要长期休养。, 必须是内射才能完成驱魔仪式。, 若是本身完成心愿过程就包含内射的鬼怪，则内射后就会立刻完成驱魔仪式。, 及时驱魔仪式完成后，千纱的意识会立刻恢复，被附身期间的记忆也不会丢失。]}], 特殊: 高桥凛奈故事开始并不清楚驱魔仪式的细节，也不知道两人存在肉体关系。两人也不会刻意在高桥面前进行、暴露两人的特殊关系。}}

  - 名称: 高桥机制
